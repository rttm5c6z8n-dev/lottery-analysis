name: Personal regression
on:
  push:
    paths:
      - 'personal/**'
      - 'tests/personal-v*.test.mjs'
      - 'tests/personal-integration.test.mjs'
      - 'tests/personal-storage-health.test.mjs'
      - 'tests/personal-browser-self-test.test.mjs'
      - 'tests/personal-real-data-check.test.mjs'
      - 'tests/personal-v31-archive-view.test.mjs'
      - 'tests/personal-five-pick-integration.test.mjs'
      - 'tests/personal-period-score.test.mjs'
      - 'tests/personal-dlt-official.test.mjs'
      - 'tests/personal-dlt-results.test.mjs'
      - 'tests/personal-dlt-archive-comparison.test.mjs'
      - 'tests/personal-dlt-endpoint.test.mjs'
      - 'tests/personal-v42-official-check.test.mjs'
      - 'tests/personal-v43-monitor.test.mjs'
      - 'tests/personal-v43-observation-summary.test.mjs'
      - 'tests/personal-five-batch-audit.test.mjs'
      - 'tests/personal-v44-random-baseline.test.mjs'
      - 'tests/personal-v45-mechanical-bias.test.mjs'
      - 'tests/personal-v45-prize-target.test.mjs'
      - 'tests/personal-v45-serial-overlap.test.mjs'
      - 'tests/personal-v45-number-stability.test.mjs'
      - 'tests/personal-v45-regime-scan.test.mjs'
      - 'tests/personal-v46-decay-challenge.test.mjs'
      - 'tests/personal-v45-ballset.test.mjs'
      - 'tests/personal-v45-exit-order.test.mjs'
      - 'tests/personal-v45-machine-endpoint.test.mjs'
      - '.github/workflows/personal-research-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test personal modules
        run: |
          node tests/personal-v38.test.mjs
          node tests/personal-v38-backup.test.mjs
          node tests/personal-v39.test.mjs
          node tests/personal-v40.test.mjs
          node tests/personal-v40-preflight.test.mjs
          node tests/personal-v40-next-draw.test.mjs
          node tests/personal-v40-live-lock-gate.test.mjs
          node tests/personal-v40-lock-proof.test.mjs
          node tests/personal-v40-server-receipt.test.mjs
          node tests/personal-v40-server-endpoint.test.mjs
          node tests/personal-v41.test.mjs
          node tests/personal-v42.test.mjs
          node tests/personal-integration.test.mjs
          node tests/personal-storage-health.test.mjs
          node tests/personal-browser-self-test.test.mjs
          node tests/personal-real-data-check.test.mjs
          node tests/personal-v31-archive-view.test.mjs
          node tests/personal-five-pick-integration.test.mjs
          node tests/personal-period-score.test.mjs
          node tests/personal-dlt-official.test.mjs
          node tests/personal-dlt-results.test.mjs
          node tests/personal-dlt-archive-comparison.test.mjs
          node tests/personal-dlt-endpoint.test.mjs
          node tests/personal-v42-official-check.test.mjs
          node tests/personal-v43-monitor.test.mjs
          node tests/personal-v43-observation-summary.test.mjs
          node tests/personal-five-batch-audit.test.mjs
          node tests/personal-v44-random-baseline.test.mjs
          node tests/personal-v45-mechanical-bias.test.mjs
          node tests/personal-v45-prize-target.test.mjs
          node tests/personal-v45-serial-overlap.test.mjs
          node tests/personal-v45-number-stability.test.mjs
          node tests/personal-v45-regime-scan.test.mjs
          node tests/personal-v46-decay-challenge.test.mjs
          node tests/personal-v45-ballset.test.mjs
          node tests/personal-v45-exit-order.test.mjs
          node tests/personal-v45-machine-endpoint.test.mjs
      - name: Validate module syntax
        run: |
          for file in personal/v{38,39,40,41,42}-core.mjs personal/v38-backup.mjs personal/storage-health.mjs personal/browser-self-test.mjs personal/real-data-check.mjs personal/v31-archive-view.mjs personal/v31-app.mjs personal/period-score.mjs personal/v40-app.mjs personal/v40-preflight.mjs personal/v40-next-draw.mjs personal/v40-live-lock-gate.mjs personal/v42-official-check.mjs personal/dlt-official-core.mjs functions/api/dlt-announcements.js personal/dlt-results-core.mjs functions/api/dlt-results.js personal/dlt-archive-comparison.mjs personal/v43-monitor-core.mjs personal/v43-observation-summary.mjs personal/five-batch-audit.mjs personal/v44-random-baseline.mjs personal/v45-mechanical-bias.mjs personal/v45-prize-target.mjs personal/v45-serial-overlap.mjs personal/v45-number-stability.mjs personal/v45-regime-scan.mjs personal/v46-decay-challenge.mjs personal/v45-ballset-core.mjs personal/v45-exit-order.mjs functions/api/dlt-machine.js; do node --check "$file"; done
