name: Personal regression
on:
  push:
    paths:
      - 'personal/**'
      - 'tests/personal-v*.test.mjs'
      - 'tests/personal-integration.test.mjs'
      - 'tests/personal-storage-health.test.mjs'
      - 'tests/personal-browser-self-test.test.mjs'
      - 'tests/personal-real-data-check.test.mjs'
      - 'tests/personal-v31-archive-view.test.mjs'
      - 'tests/personal-five-pick-integration.test.mjs'
      - 'tests/personal-period-score.test.mjs'
      - 'tests/personal-dlt-official.test.mjs'
      - 'tests/personal-dlt-results.test.mjs'
      - 'tests/personal-dlt-archive-comparison.test.mjs'
      - 'tests/personal-dlt-endpoint.test.mjs'
      - 'tests/personal-v42-official-check.test.mjs'
      - 'tests/personal-v43-monitor.test.mjs'
      - 'tests/personal-v43-observation-summary.test.mjs'
      - 'tests/personal-five-batch-audit.test.mjs'
      - 'tests/personal-v44-random-baseline.test.mjs'
      - '.github/workflows/personal-research-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test personal modules
        run: |
          node tests/personal-v38.test.mjs
          node tests/personal-v38-backup.test.mjs
          node tests/personal-v39.test.mjs
          node tests/personal-v40.test.mjs
          node tests/personal-v40-preflight.test.mjs
          node tests/personal-v40-next-draw.test.mjs
          node tests/personal-v41.test.mjs
          node tests/personal-v42.test.mjs
          node tests/personal-integration.test.mjs
          node tests/personal-storage-health.test.mjs
          node tests/personal-browser-self-test.test.mjs
          node tests/personal-real-data-check.test.mjs
          node tests/personal-v31-archive-view.test.mjs
          node tests/personal-five-pick-integration.test.mjs
          node tests/personal-period-score.test.mjs
          node tests/personal-dlt-official.test.mjs
          node tests/personal-dlt-results.test.mjs
          node tests/personal-dlt-archive-comparison.test.mjs
          node tests/personal-dlt-endpoint.test.mjs
          node tests/personal-v42-official-check.test.mjs
          node tests/personal-v43-monitor.test.mjs
          node tests/personal-v43-observation-summary.test.mjs
          node tests/personal-five-batch-audit.test.mjs
          node tests/personal-v44-random-baseline.test.mjs
      - name: Validate module syntax
        run: |
          for file in personal/v{38,39,40,41,42}-core.mjs personal/v38-backup.mjs personal/storage-health.mjs personal/browser-self-test.mjs personal/real-data-check.mjs personal/v31-archive-view.mjs personal/v31-app.mjs personal/period-score.mjs personal/v40-app.mjs personal/v40-preflight.mjs personal/v40-next-draw.mjs personal/v42-official-check.mjs personal/dlt-official-core.mjs functions/api/dlt-announcements.js personal/dlt-results-core.mjs functions/api/dlt-results.js personal/dlt-archive-comparison.mjs personal/v43-monitor-core.mjs personal/v43-observation-summary.mjs personal/five-batch-audit.mjs personal/v44-random-baseline.mjs; do node --check "$file"; done
