<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16.1 全量官方数据核验</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf3ff;font:15px/1.7 system-ui}main{max-width:760px;margin:auto;padding:18px}h1{font-size:25px}h2{font-size:19px}.card{background:#1d2b43;border:1px solid #39506d;border-radius:16px;padding:18px;margin:16px 0}p,small{color:#bac8db}button{width:100%;background:#3978e7;color:white;border:0;border-radius:9px;padding:13px;font:700 16px system-ui;margin:8px 0}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #425875;padding:8px;text-align:left}a{color:#93caff}.scroll{overflow:auto}.good{color:#8de0b0}.warn{color:#ffce83}progress{width:100%;height:16px}</style></head><body><main><h1>V16.1 · 官方历史数据全量核验</h1><p>官方接口自动翻页 · 逐期比对 · 异常导出 · 不修改历史缓存</p><div class="card"><h2>核验控制台</h2><p id="local">正在读取本机历史…</p><button id="start">开始自动翻页核验</button><button id="stop" disabled style="background:#586a83">停止并保留已核验结果</button><progress id="progress" max="1" value="0"></progress><p id="status" aria-live="polite">尚未运行。</p><small>每页请求30期，最多150页；接口提前返回空页时停止。网络失败最多重试2次，仍失败则标记中断，绝不把未读取期数算作一致。官方接口可能限制访问或调整返回格式。</small></div><div class="card"><h2>核验统计</h2><div id="summary">等待核验。</div><button id="download" disabled>下载完整核验报告 CSV</button></div><div class="card"><h2>差异和缺失记录</h2><div id="issues">尚无结果。</div></div><p>本工具仅核对官方接口实际返回的数据，不能自动证明官方历史接口完整，也不代表彩票预测能力。重要记录仍建议与<a href="https://www.sporttery.cn/digitallottery/index.html" target="_blank" rel="noopener">官方公告页面</a>交叉核对。</p><a href="./v16.html">返回 V16 单页核验</a> · <a href="./index.html">返回统计首页</a></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),base='https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageSize=30&isVerify=1&pageNo=';
let local=[],running=false,stop=false,report=[],pages=0,errors=[],completed=false,officialCount=0;
try{local=JSON.parse(localStorage.getItem('lottery_v2_dlt')||'[]');if(!Array.isArray(local))local=[]}catch(e){}
$('local').textContent='本机大乐透历史：'+local.length+'期。'+(!local.length?'请先返回统计首页加载真实数据。':'');
function parse(x){let period=String(x.lotteryDrawNum||x.lottery_draw_num||x.issue||'').trim(),date=String(x.lotteryDrawTime||x.lottery_draw_time||x.date||'').slice(0,10),raw=x.lotteryDrawResult||x.lottery_draw_result||'';let nums=Array.isArray(raw)?raw.map(Number):(String(raw).match(/\d{1,2}/g)||[]).map(Number);return {period,date,nums}}
function valid(r){let n=r.nums;return /^\d{5}$/.test(r.period)&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&!Number.isNaN(Date.parse(r.date))&&n.length===7&&n.slice(0,5).every(x=>Number.isInteger(x)&&x>=1&&x<=35)&&n.slice(5).every(x=>Number.isInteger(x)&&x>=1&&x<=12)&&new Set(n.slice(0,5)).size===5&&new Set(n.slice(5)).size===2}
const wait=ms=>new Promise(r=>setTimeout(r,ms)),fmt=r=>r?r.date+' / '+r.nums.map(x=>String(x).padStart(2,'0')).join(' '):'—';
async function fetchPage(page){let last;for(let retry=0;retry<3;retry++){if(stop)throw Error('用户停止');try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);let response;try{response=await fetch(base+page,{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}if(!response.ok)throw Error('HTTP '+response.status);let json=await response.json();let list=json?.value?.list;if(!Array.isArray(list))throw Error('官方返回结构异常');return list}catch(e){last=e;if(retry<2)await wait(500*(retry+1))}}throw last}
function show(){let match=report.filter(x=>x.state==='一致').length,diff=report.filter(x=>x.state==='不一致').length,missing=report.filter(x=>x.state==='本地缺失').length,verified=match+diff,unverified=Math.max(0,local.length-verified),coverage=local.length?(100*verified/local.length).toFixed(2):'0.00';$('summary').innerHTML='<p>请求成功页数：<b>'+pages+'</b>；官方有效唯一记录：<b>'+officialCount+'</b></p><p class="good">一致：'+match+'期</p><p class="warn">不一致：'+diff+'期；本地缺失：'+missing+'期</p><p>本地未核验：'+unverified+'期；本地覆盖率：<b>'+coverage+'%</b></p><p>状态：'+(running?'核验中':completed?'接口已返回空页，翻页结束':'未完整结束或中断')+'。'+(errors.length?'异常：'+errors.join('；'):'')+'</p>';let issues=report.filter(x=>x.state!=='一致');$('issues').innerHTML=issues.length?'<div class="scroll"><table><tr><th>期号</th><th>状态</th><th>本地</th><th>官方接口</th></tr>'+issues.slice(0,100).map(x=>'<tr><td>'+x.period+'</td><td>'+x.state+'</td><td>'+fmt(x.local)+'</td><td>'+fmt(x.official)+'</td></tr>').join('')+'</table></div><small>页面最多显示100条异常；报告可导出全部。</small>':'已读取的有效记录暂无差异。';$('download').disabled=!report.length}
$('start').onclick=async()=>{if(running)return;if(!local.length){$('status').textContent='没有本地数据，请先打开统计首页加载。';return}running=true;stop=false;completed=false;report=[];pages=0;errors=[];officialCount=0;$('start').disabled=true;$('stop').disabled=false;let map=new Map(local.map(r=>[String(r.period),r])),seen=new Set();try{for(let page=1;page<=150;page++){if(stop)break;$('status').textContent='正在读取第 '+page+' 页；已核验 '+report.length+' 条…';let list=await fetchPage(page);if(stop)break;if(!list.length){completed=true;break}let parsed=list.map(parse);if(parsed.some(r=>!valid(r))){errors.push('第'+page+'页存在无法解析的记录，已停止');break}let fresh=0;for(let r of parsed){if(seen.has(r.period))continue;seen.add(r.period);fresh++;let old=map.get(r.period),same=old&&old.date===r.date&&old.nums.join(',')===r.nums.join(',');report.push({period:r.period,state:!old?'本地缺失':same?'一致':'不一致',local:old||null,official:r})}pages++;officialCount=seen.size;$('progress').value=page/150;show();if(!fresh){errors.push('第'+page+'页无新增期号，停止防止循环');break}await wait(180)}if(pages===150&&!completed)errors.push('达到150页安全上限，未确认全量完成')}catch(e){errors.push('接口中断：'+e.message)}finally{running=false;$('start').disabled=false;$('stop').disabled=true;$('status').textContent=stop?'用户已停止，保留部分核验结果':completed?'翻页完成（接口返回空页），请核对覆盖率':'核验中断或达到上限，未完成全量核验';show()}};
$('stop').onclick=()=>{stop=true;$('status').textContent='正在停止，等待当前请求结束…'};
function cell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
$('download').onclick=()=>{let seen=new Set(report.map(x=>x.period));let rows=[['期号','状态','本地日期与号码','官方日期与号码'],...report.map(x=>[x.period,x.state,fmt(x.local),fmt(x.official)]),...local.filter(x=>!seen.has(String(x.period))).map(x=>[x.period,'未核验',fmt(x),''])];let csv='\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='V16.1-大乐透官方接口核验报告.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
})();
</script></body></html>
