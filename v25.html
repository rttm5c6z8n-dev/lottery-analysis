<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V25 官方休市证据档案</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf3ff;font:15px/1.7 system-ui}main{max-width:820px;margin:auto;padding:20px}.card{background:#1e2b43;border:1px solid #3a506d;border-radius:17px;padding:20px;margin:16px 0}h1{font-size:26px}h2{font-size:19px}p{color:#c6d1e0}button{width:100%;background:#3978e7;color:white;border:0;border-radius:9px;padding:13px;font:inherit;font-weight:700}a{color:#9ccaff}.warn{color:#ffd38e}.ok{color:#8de7b5}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #40536f;text-align:left;vertical-align:top}.scroll{overflow:auto}</style></head><body><main><h1>V25 · 历年官方休市证据核验</h1><p>基于V24发现的7处长间隔｜官方休市公告对照｜只读审计</p><section class="card"><h2>1. 运行核验</h2><p id="source">等待读取本地大乐透数据。</p><button id="run">运行V25休市证据核验</button><p id="status">尚未运行。</p></section><section class="card"><h2>2. 逐项证据</h2><div id="results">等待核验。</div><button id="download" disabled>下载V25证据档案CSV</button></section><section class="card"><h2>3. 判定边界</h2><p class="warn">官方休市公告只能说明休市期间暂停开奖，不等于相邻两期号码已获官方逐条认证。公告链接由人工选定，仍需检查原文与日期。无来源的间隔必须标记“待核”，不得自动视为正常。</p><p>本工具不更改历史缓存、不修改V17锁定记录，也不提高独立开奖的中奖概率。</p><a href="v24.html">返回V24</a> · <a href="index.html">统计首页</a></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const evidence={2020:{start:'2020-01-22',end:'2020-03-13',url:'https://www.sporttery.cn/szcp/gytc/2020/0311/604694.html',title:'2020年恢复开奖说明',note:'疫情期间延长休市；须结合恢复开奖说明核验'},2021:{start:'2021-02-09',end:'2021-02-18',url:'https://www.sport.gov.cn/n20001280/n20067608/n20067637/c20224789/content.html',title:'2021年春节休市公告'},2022:{start:'2022-01-29',end:'2022-02-07',url:'https://www.sport.gov.cn/cpzx/n5656/c23927715/content.html',title:'2022年春节休市公告'},2024:{start:'2024-02-08',end:'2024-02-17',url:'https://www.zhcw.com/c/2024-01-23/851973.shtml',title:'2024年春节休市公告（转载）'},2025:{start:'2025-01-27',end:'2025-02-05',url:'https://m.lottery.gov.cn/xxgk/tzggz/20241230/10046430.html',title:'2025年春节休市公告'},2026:{start:'2026-02-14',end:'2026-02-23',url:'https://www.gstc.org.cn/newsDetail/160700/77694',title:'2026年春节休市公告（甘肃体彩转载）'}};let csv='';function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function dt(s){return new Date(s+'T12:00:00Z').getTime()}function run(){try{const raw=localStorage.getItem('lottery_v2_dlt');if(!raw)throw Error('未找到本地缓存，请先访问统计首页');const data=JSON.parse(raw);if(!Array.isArray(data))throw Error('缓存格式不正确');const groups=new Map();for(const r of data){const p=String(r.period||''),d=String(r.date||'');if(!/^\d{5}$/.test(p)||!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(dt(d)))continue;const y=2000+Number(p.slice(0,2));if(!groups.has(y))groups.set(y,[]);groups.get(y).push({p,d})}const out=[];for(const [y,arr] of groups){arr.sort((a,b)=>Number(a.p)-Number(b.p));for(let i=1;i<arr.length;i++){const a=arr[i-1],b=arr[i],days=Math.round((dt(b.d)-dt(a.d))/86400000);if(days<=10)continue;const e=evidence[y];const overlap=e&&dt(a.d)<dt(e.end)&&dt(b.d)>dt(e.start);out.push({y,period:a.p+' → '+b.p,range:a.d+' → '+b.d,days,status:overlap?'公告休市日期重叠（需人工核对）':'尚未匹配休市公告',e:overlap?e:null})}}out.sort((a,b)=>a.y-b.y);$('source').textContent='本地缓存 '+data.length+' 条；识别长间隔 '+out.length+' 处。';$('status').textContent='核验完成：'+out.filter(x=>x.e).length+' 处找到日期重叠的公告，'+out.filter(x=>!x.e).length+' 处待核。公告不等于逐期号码认证。';$('results').innerHTML='<div class="scroll"><table><tr><th>年度 / 期号</th><th>间隔</th><th>证据状态</th></tr>'+out.map(x=>'<tr><td>'+esc(x.y)+'<br>'+esc(x.period)+'<br>'+esc(x.range)+'</td><td>'+x.days+'天</td><td>'+esc(x.status)+(x.e?'<br><a target="_blank" rel="noopener noreferrer" href="'+esc(x.e.url)+'">'+esc(x.e.title)+'</a><br>公告休市 '+esc(x.e.start)+' 至 '+esc(x.e.end):'')+'</td></tr>').join('')+'</table></div>';csv='\ufeff'+[['年度','相邻期号','相邻日期','间隔天数','核验状态','公告标题','公告链接'],...out.map(x=>[x.y,x.period,x.range,x.days,x.status,x.e?.title||'',x.e?.url||''])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');$('download').disabled=false}catch(e){$('status').textContent='核验失败：'+e.message}}$('run').addEventListener('click',run);$('download').addEventListener('click',()=>{if(!csv)return;const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='V25-休市证据档案.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})})();</script></body></html>
