<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数理彩研 · 临时研究选号</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3ff;font:16px/1.65 system-ui}main{max-width:740px;margin:auto;padding:20px}h1{font-size:26px}.card{background:#1e2b43;border:1px solid #3a506d;border-radius:16px;padding:18px;margin:16px 0}p,small{color:#c2d0e3}input,button{font:inherit;border-radius:9px;padding:12px;max-width:100%}input{background:#111d30;border:1px solid #71829b;color:white;width:100%}button{background:#3978e7;color:white;border:0;margin:8px 6px 8px 0}button:disabled{opacity:.5}.balls{font-size:19px;font-weight:750;letter-spacing:1px;overflow-wrap:anywhere}.note{color:#f0c47b}a{color:#9bc9ff}.item{border-top:1px solid #3a506d;padding:12px 0}</style></head><body><main><h1>数理彩研 · 临时研究选号</h1><p><a href="./">返回首页</a> · <a href="personal/">返回B+C研究</a></p><div class="card"><h2>生成5组研究号码</h2><p class="note">独立临时入口，不调用或改写B+C模型，不宣称优于随机，也不等于正式预测锁定。五组号码按覆盖分散规则生成；无预测能力评分。</p><label for="period">目标期号（可留空，待官方确认）</label><input id="period" inputmode="numeric" maxlength="12" placeholder="例如 26131"><button id="generate">生成5组号码</button><button id="save" disabled>保存本次记录</button><button id="export">导出全部记录 JSON</button><p id="status" aria-live="polite"></p><div id="sets"></div></div><div class="card"><h2>开奖后核对</h2><p>先保存号码，再填入官方开奖号码；仅核对匹配数量，不自动判定奖金或中奖等级。</p><label for="front">前区5个号码（空格分隔）</label><input id="front" placeholder="01 02 03 04 05"><label for="back">后区2个号码（空格分隔）</label><input id="back" placeholder="01 02"><button id="check">核对已保存记录</button><div id="result"></div></div><div class="card"><h2>本机保存记录</h2><p>仅保存于当前浏览器。换设备或清除网站数据可能丢失，请导出JSON备份。</p><div id="history"></div></div></main><script>
"use strict";
const key="lottery_temporary_research_v1";let current=null;
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
function sample(max,count,excluded=[]){const pool=Array.from({length:max},(_,i)=>i+1).filter(n=>!excluded.includes(n));const out=[];while(out.length<count){const i=Math.floor(Math.random()*pool.length);out.push(pool.splice(i,1)[0]);}return out.sort((a,b)=>a-b);}
function fmt(a){return a.map(pad).join(" ")}
function valid(text,max,count){const a=text.trim().split(/[\s,，、]+/).map(Number);return a.length===count&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=max)&&new Set(a).size===count?a:null}
function records(){try{const r=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(r)?r:[]}catch{return []}}
function renderSets(){ $("sets").innerHTML=current?current.sets.map((s,i)=>'<div class="item"><strong>第'+(i+1)+'组</strong><div class="balls">'+fmt(s.front)+' + '+fmt(s.back)+'</div></div>').join(""):""}
function renderHistory(){const r=records();$("history").innerHTML=r.length?r.slice().reverse().map(x=>'<div class="item"><strong>'+String(x.period||"期号待确认").replace(/[<>&]/g,"")+'</strong> · '+new Date(x.createdAt).toLocaleString("zh-CN")+'<div>'+x.sets.map((s,i)=>(i+1)+". "+fmt(s.front)+" + "+fmt(s.back)).join("<br>")+'</div></div>').join(""):"暂无保存记录"}
$("generate").onclick=()=>{const period=$("period").value.trim();if(period&&!/^\d{4,12}$/.test(period)){$("status").textContent="期号须为4至12位数字，或留空";return}const sets=[],frontUsed=[],backUsed=[];for(let i=0;i<5;i++){let front=sample(35,5,frontUsed.length<=30?frontUsed:[]);let back=sample(12,2,backUsed.length<=10?backUsed:[]);sets.push({front,back});frontUsed.push(...front);backUsed.push(...back)}current={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),period,createdAt:new Date().toISOString(),method:"coverage-diversified-uniform-v1",sets};renderSets();$("save").disabled=false;$("status").textContent="已生成，尚未保存。每组一等奖理论概率相同。"};
$("save").onclick=()=>{if(!current)return;try{const r=records();if(r.some(x=>x.id===current.id)){$("status").textContent="本次已保存，无需重复保存";return}r.push(current);localStorage.setItem(key,JSON.stringify(r));$("status").textContent="已保存到当前浏览器，建议导出JSON备份";$("save").disabled=true;renderHistory()}catch(e){$("status").textContent="保存失败："+e.message}};
$("export").onclick=()=>{const data=JSON.stringify({exportedAt:new Date().toISOString(),records:records()},null,2);const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="lottery-temporary-research.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$("check").onclick=()=>{const f=valid($("front").value,35,5),b=valid($("back").value,12,2);if(!f||!b){$("result").textContent="请检查号码数量、范围和重复号码";return}const r=records(),period=$("period").value.trim();const selected=period?r.filter(x=>x.period===period):r;if(!selected.length){$("result").textContent="没有找到对应已保存记录";return}$("result").innerHTML=selected.map(x=>'<div class="item"><strong>期号 '+(x.period||"待确认")+'</strong>'+x.sets.map((s,i)=>'<div>第'+(i+1)+'组：前区命中 '+s.front.filter(n=>f.includes(n)).length+' 个，后区命中 '+s.back.filter(n=>b.includes(n)).length+' 个</div>').join("")+'</div>').join("")};
renderHistory();
</script></body></html>
