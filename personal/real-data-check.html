<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数理彩研 · 真实历史及模型只读联调</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:840px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button{background:#4179e6;color:white;border:0;border-radius:9px;padding:12px;font:inherit;width:100%}a{color:#9ccaff}pre{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#9eecac}.bad{color:#ffbdac}small{color:#c5d0df}h1{font-size:26px}</style></head><body><main><a href="./">← 返回研究首页</a><h1>真实数据只读联调</h1><p>检查原始历史缓存与研究快照是否一致，并核对训练、验证报告及模型选号结果能否衔接。只读本机数据库，不写入、不重新训练、不更换历史数据。</p><section><button id="run">开始检查真实本机研究数据</button><p id="status" role="status">尚未检查</p><pre id="details"></pre></section><section><h2>检查范围和限制</h2><p>核对本机快照的号码格式、重复期号、排序，以及训练、报告、选号结果之间的关联。若显示“无选号结果”，仅代表此浏览器这个数据库里没有找到，不代表号码被删除。</p><p><small>这不是官方开奖逐期校验，也不能证明模型能预测下一期。请使用原来保存数据的同一浏览器及正常模式打开。</small></p></section></main><script type="module">import{readResearchData,diagnoseResearch,inspectOriginalHistory}from './real-data-check.mjs';const btn=document.getElementById('run'),status=document.getElementById('status'),details=document.getElementById('details');btn.onclick=async()=>{btn.disabled=true;status.textContent='正在只读检查本机数据库…';details.textContent='';try{const data=await readResearchData(globalThis.indexedDB),r=diagnoseResearch(data),c=r.counts;const original=await inspectOriginalHistory(localStorage.getItem('lottery_v2_dlt'),data.snapshots);const lines=['历史快照：'+c.snapshots,'训练记录：'+c.trains,'验证报告：'+c.reports,'选号结果：'+c.results,'搜索任务：'+c.searches,'格式有效的选号结果：'+r.validResults];lines.unshift('原始历史缓存：'+(original.state==='present'?original.count+'期（格式有效'+original.valid+'，重复期号'+original.duplicates+'）':original.message));if(original.state==='present')lines.push('原始缓存与现存快照指纹匹配：'+(original.matches===null?'当前浏览器不支持指纹计算':original.matches+'个'));if(original.state==='present'&&original.matches===0)lines.push('注意：没有匹配指纹的快照可能因为曾重新导入或重新生成；不能据此认定数据丢失');if(r.latestSnapshot){const s=r.latestSnapshot;lines.push('最新快照：'+s.rows+'期，'+s.start+' → '+s.end);lines.push('最新快照格式错误：'+s.invalid+'，重复期号：'+s.duplicates+'，排序问题：'+s.orderErrors);lines.push('历史数据指纹：'+(s.sourceHash||'未记录'))}lines.push('结构错误：'+r.errors.length,'提醒：'+r.warnings.length);for(const e of r.errors)lines.push('错误：'+e);for(const w of r.warnings)lines.push('提醒：'+w);lines.push('');lines.push(r.disclaimer);status.textContent=r.errors.length?'检查完成：发现'+r.errors.length+'项结构问题':'检查完成：没有发现已读取数据的结构错误';status.className=r.errors.length?'bad':'ok';details.textContent=lines.join('\n')}catch(e){status.textContent='检查未完成：'+e.message;status.className='bad'}finally{btn.disabled=false}};</script></body></html>
