<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5.0 候选池只读核验</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf3ff;font:15px/1.7 system-ui}main{max-width:800px;margin:auto;padding:16px}section{background:#1d2b43;border:1px solid #415674;border-radius:14px;padding:17px;margin:16px 0}button{font:inherit;padding:12px;background:#90baff;border:0;border-radius:9px;color:#10203a;font-weight:650}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a1c9ff}small{color:#bacbe0}</style></head><body><main><a href="./v50.html">← V5.0预注册</a><h1>V5.0 · 候选池与评分来源核验</h1><p>只读检查本机V3.1存档及来源链，判断B轨是否具备完整、可复核的候选池。不会重新选号、改写任何数据或登记未来期号。</p><section><button id="run">只读检查本机研究档案</button><pre id="status">尚未检查。</pre><pre id="results"></pre></section><section><h2>判定原则</h2><p>V3.1结果里的5个最终选号不等于完整候选池。即使有5注评分，也不能直接声称能独立生成B轨。只有找到开奖前已保存、可核验来源的更多候选组合及原始评分，才能继续开发B轨锁定。</p><small>当前页面不会创建IndexedDB数据库；若没有旧数据库，将直接报告缺失。</small></section></main><script type="module">
import{inspectArchiveResult}from './v31-archive-view.mjs';
const $=id=>document.getElementById(id);
function readStore(db,name){return new Promise((resolve,reject)=>{if(!db.objectStoreNames.contains(name)){resolve([]);return}const tx=db.transaction(name,'readonly'),req=tx.objectStore(name).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function openExisting(){return new Promise((resolve,reject)=>{let missing=false;const req=indexedDB.open('lottery_personal_v31');req.onupgradeneeded=()=>{missing=true;req.transaction.abort()};req.onerror=()=>reject(Error(missing?'本机没有V3.1研究库，未创建新库':'无法打开原研究库'));req.onblocked=()=>reject(Error('数据库被其他标签占用'));req.onsuccess=()=>resolve(req.result)})}
$('run').onclick=async()=>{const btn=$('run');btn.disabled=true;$('status').textContent='正在只读检查……';$('results').textContent='';let db;try{db=await openExisting();const names=['snapshots','trains','reports','results','searches'];const data={};for(const name of names)data[name]=await readStore(db,name);const counts=names.map(n=>n+'：'+data[n].length).join('；');const valid=[];for(const result of data.results){try{const x=inspectArchiveResult(result,data);if(x.complete&&x.sourceConsistent)valid.push({result,inspection:x})}catch{}}valid.sort((a,b)=>String(b.result.generatedAt).localeCompare(String(a.result.generatedAt)));$('status').textContent='只读检查完成。'+counts+'\n符合V4.0完整来源条件的5注存档：'+valid.length+'份。';const lines=[];for(const {result,inspection} of valid.slice(0,5)){const scored=inspection.picks.filter(x=>x.score!==null).length;lines.push('存档：'+String(result.id).slice(0,90)+'\n历史截止：'+inspection.throughPeriod+'；生成时间：'+inspection.generatedAt+'\n最终选号：'+inspection.picks.length+'注；有数值评分：'+scored+'注\n记录覆盖声明：'+result.covered+'/'+result.total+'（表示搜索覆盖，不表示保存了全部候选及评分）\n结果字段：'+Object.keys(result).join('、'))}if(!lines.length)lines.push('没有符合条件的完整5注存档。');lines.push('\n结论：此页仅能证实已保存结果及字段，不能从“搜索覆盖21425712组合”推断候选池完整持久化。下一步须核实搜索任务中是否保存候选列表及评分。');$('results').textContent=lines.join('\n\n')}catch(e){$('status').textContent='检查失败：'+e.message+'；没有修改任何历史数据。'}finally{if(db)db.close();btn.disabled=false}};
</script></body></html>
