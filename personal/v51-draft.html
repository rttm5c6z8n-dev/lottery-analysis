<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5.1 三轨预注册草案</title><style>body{margin:0;background:#101827;color:#edf3ff;font:15px/1.65 system-ui}main{max-width:780px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #415674;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:26px}h2{font-size:19px}button,input{font:inherit}button{background:#9bbdff;color:#12223e;border:0;border-radius:8px;padding:11px;font-weight:600}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a7caff}input[type=text]{width:100%;padding:10px}small{color:#c4d0e2}</style></head><body><main><a href="./v50-ab.html">← V5.0 A/B分析</a><h1>V5.1 · 三轨预注册草案</h1><p>导入旧模型A/B诊断报告，生成可复现的C轨随机对照并计算SHA-256。<strong>仅供流程验证，不是正式未来期号锁定。</strong></p><section><h2>1. 导入A/B诊断JSON</h2><input type="file" id="file" accept=".json,application/json"><pre id="status">尚未导入。</pre></section><section><h2>2. 随机对照与参数</h2><p>随机种子（64位十六进制，点击生成）：</p><input id="seed" type="text" readonly placeholder="点击生成随机种子"><p><button id="newseed">生成C轨随机种子</button></p><p>研究目标期号：<input id="period" type="text" placeholder="仅填写技术演示标识，例如 DEMO" value="DEMO"></p><button id="make" disabled>生成三轨草案和摘要</button><pre id="result">等待导入。</pre></section><section><h2>3. 导出凭证</h2><button id="export" disabled>下载草案JSON</button><p><small>本工具不查询官方开奖、不自动判定开奖前后。浏览器生成时间和SHA-256不能单独证明事前锁定；正式预注册需要可信的外部时间戳与公开提交记录，且不能使用已知开奖结果挑选方案。</small></p></section></main><script type="module">
const $=id=>document.getElementById(id);let source=null,output=null;
const enc=new TextEncoder();
const hex=bytes=>Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
const hash=async s=>hex(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s))));
const fmt=n=>String(n).padStart(2,'0');
const validPick=p=>{const n=p?.nums;if(!Array.isArray(n)||n.length!==7)return false;const a=n.slice(0,5),b=n.slice(5);return a.every((x,i)=>Number.isInteger(x)&&x>=1&&x<=35&&(!i||x>a[i-1]))&&b.every((x,i)=>Number.isInteger(x)&&x>=1&&x<=12&&(!i||x>b[i-1]))};
$('file').onchange=async e=>{source=null;output=null;$('make').disabled=true;$('export').disabled=true;try{const d=JSON.parse(await e.target.files[0].text());if(d.type!=='V5.0-AB-structure-diagnostic-only'||d.formalLock!==false||d.throughPeriod!=='26128'||d.lambda!==1||!Array.isArray(d.A?.picks)||!Array.isArray(d.B?.picks)||d.A.picks.length!==5||d.B.picks.length!==5||![...d.A.picks,...d.B.picks].every(validPick)||!d.sourceResultId||!/^[a-f0-9]{64}$/.test(d.sourceDigest))throw Error('请导入完整的26128旧模型λ=1.0诊断报告');source=d;$('status').textContent='已读取A/B各5注；旧模型截止26128；λ=1.0。仅验证报告格式，未独立复算来源评分。';$('make').disabled=false}catch(err){$('status').textContent='导入失败：'+err.message}};
$('newseed').onclick=()=>{$('seed').value=hex(crypto.getRandomValues(new Uint8Array(32)));output=null;$('export').disabled=true};
async function draw(seed,domain,count,max){let selected=new Set(),index=0;while(selected.size<count){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(seed+':'+domain+':'+index++)));for(let i=0;i+3<h.length&&selected.size<count;i+=4){const n=((h[i]*16777216)+(h[i+1]<<16)+(h[i+2]<<8)+h[i+3])>>>0;const range=Math.floor(4294967296/max)*max;if(n<range)selected.add(n%max+1)}}return [...selected].sort((a,b)=>a-b)}
$('make').onclick=async()=>{try{const seed=$('seed').value,period=$('period').value.trim();if(!/^[a-f0-9]{64}$/.test(seed))throw Error('请先生成随机种子');if(!/^[A-Za-z0-9_-]{1,24}$/.test(period))throw Error('期号格式不合法');const C=[];for(let i=0;i<5;i++){const a=await draw(seed,'front-'+i,5,35),b=await draw(seed,'back-'+i,2,12);C.push({nums:[...a,...b]})}const payload={schema:'V5.1-three-track-draft-1',researchOnly:true,formalLock:false,period,throughPeriod:source.throughPeriod,sourceResultId:source.sourceResultId,sourceDigest:source.sourceDigest,lambda:1,seed,method:'SHA-256 deterministic rejection sampling, independent per ticket and zone',A:source.A.picks.map(p=>({nums:p.nums,score:p.score})),B:source.B.picks.map(p=>({nums:p.nums,score:p.score})),C,createdAt:new Date().toISOString()};const canonical=JSON.stringify(payload),sha256=await hash(canonical);output={payload,sha256};$('result').textContent='草案SHA-256：'+sha256+'\nC轨随机5注：\n'+C.map((p,i)=>(i+1)+'. '+p.nums.slice(0,5).map(fmt).join(' ')+' + '+p.nums.slice(5).map(fmt).join(' ')).join('\n')+'\n\n仅技术演示，未正式锁定，不能用作事前证据。';$('export').disabled=false}catch(e){$('result').textContent='失败：'+e.message}};
$('export').onclick=()=>{if(!output)return;const blob=new Blob([JSON.stringify(output,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='v51-three-track-DRAFT.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></body></html>
