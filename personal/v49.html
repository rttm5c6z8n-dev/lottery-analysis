<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4.9 号码结构研究</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf3ff;font:15px/1.65 system-ui}main{max-width:820px;margin:auto;padding:16px}section{background:#1d2b43;border:1px solid #415674;border-radius:14px;padding:17px;margin:16px 0}button,input{font:inherit;max-width:100%}button{padding:12px;background:#90baff;color:#10203a;border:0;border-radius:9px;font-weight:650}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a1c9ff}small{color:#bbc8da}h1{font-size:25px}h2{font-size:19px}</style></head><body><main><nav><a href="./v48.html">← V4.8 长期实验</a> · <a href="./v47.html">V4.7 原始凭证</a></nav><h1>V4.9 · 号码结构研究（只读）</h1><p>研究固定的模型5注与随机5注的覆盖、重复和公平开奖结构基准。不生成预测，不修改锁定记录，不写入本机存储。</p><section><h2>1. 选择开奖前保存的JSON</h2><input id="file" type="file" accept=".json,application/json"><p><small>仅本机读取；本页进行格式与号码检查，不代替V4.7的SHA-256凭证核验。请先在V4.7验证原始凭证。</small></p><pre id="status">请选择dlt-paired-control-26130.json等原始凭证。</pre></section><section><h2>2. 两组覆盖与集中程度</h2><pre id="structure">等待读取。</pre></section><section><h2>3. 精确公平开奖结构基准</h2><button id="run" disabled>枚举全部324632种前区结果</button><pre id="baseline">尚未计算。</pre><small>这里的胜负仅指“5注中最佳前区命中数”。它不是一等奖胜率，也不能证明开奖存在偏差。</small></section></main><script>
const $=id=>document.getElementById(id);let pair=null;
function valid(t){return t&&Array.isArray(t.front)&&t.front.length===5&&new Set(t.front).size===5&&t.front.every(n=>Number.isInteger(n)&&n>=1&&n<=35)&&Array.isArray(t.back)&&t.back.length===2&&new Set(t.back).size===2&&t.back.every(n=>Number.isInteger(n)&&n>=1&&n<=12)}
function stats(tickets){const f=tickets.flatMap(t=>t.front),b=tickets.flatMap(t=>t.back),freq=new Map();for(const n of f)freq.set(n,(freq.get(n)||0)+1);const repeats=[...freq].filter(([n,c])=>c>1).sort((a,b)=>b[1]-a[1]||a[0]-b[0]);return {frontUnique:new Set(f).size,backUnique:new Set(b).size,frontRepeated:25-new Set(f).size,backRepeated:10-new Set(b).size,frontMax:Math.max(...freq.values()),repeats}}
function display(s){return '前区不同号码：'+s.frontUnique+'/35；25个选号位中重复占位：'+s.frontRepeated+'\n后区不同号码：'+s.backUnique+'/12；10个选号位中重复占位：'+s.backRepeated+'\n前区最高重复次数：'+s.frontMax+'/5\n前区重复号码：'+(s.repeats.map(([n,c])=>String(n).padStart(2,'0')+'×'+c).join('，')||'无')}
$('file').addEventListener('change',async e=>{pair=null;$('run').disabled=true;$('baseline').textContent='尚未计算。';try{const f=e.target.files?.[0];if(!f)return;const obj=JSON.parse(await f.text()),p=obj.payload;if(p?.format!=='V4.7-paired-control-v1'||!/^\d{5}$/.test(String(p.period))||p.modelTickets?.length!==5||p.controlTickets?.length!==5||![...p.modelTickets,...p.controlTickets].every(valid))throw Error('不是结构完整的V4.7配对凭证');pair=p;const m=stats(p.modelTickets),c=stats(p.controlTickets);$('status').textContent='已读取第'+p.period+'期，模型5注与随机5注；本页没有改写任何记录。\n提醒：请以V4.7验证指纹与种子。';$('structure').textContent='【模型组】\n'+display(m)+'\n\n【随机对照组】\n'+display(c)+'\n\n前区覆盖差（模型−随机）：'+(m.frontUnique-c.frontUnique)+'个';$('run').disabled=false}catch(err){$('status').textContent='读取失败：'+err.message;$('structure').textContent='等待有效文件。'}});
$('run').onclick=async()=>{if(!pair)return;const btn=$('run');btn.disabled=true;$('baseline').textContent='正在精确枚举，请等待……';const model=pair.modelTickets.map(t=>t.front.reduce((v,n)=>v|(1n<<BigInt(n-1)),0n));const control=pair.controlTickets.map(t=>t.front.reduce((v,n)=>v|(1n<<BigInt(n-1)),0n));const pop=x=>{let n=0;while(x){x&=x-1n;n++}return n};let mw=0,cw=0,tie=0,ms=0,cs=0,count=0;try{for(let a=0;a<31;a++){for(let b=a+1;b<32;b++)for(let c=b+1;c<33;c++)for(let d=c+1;d<34;d++)for(let e=d+1;e<35;e++){const draw=(1n<<BigInt(a))|(1n<<BigInt(b))|(1n<<BigInt(c))|(1n<<BigInt(d))|(1n<<BigInt(e));let m=0,r=0;for(const x of model)m=Math.max(m,pop(x&draw));for(const x of control)r=Math.max(r,pop(x&draw));ms+=m;cs+=r;count++;if(m>r)mw++;else if(m<r)cw++;else tie++}if(a%3===0){$('baseline').textContent='已完成 '+count+' 种组合……';await new Promise(resolve=>setTimeout(resolve,0))}}if(count!==324632)throw Error('枚举数量异常：'+count);const pct=x=>(100*x/count).toFixed(2)+'%';$('baseline').textContent='精确枚举 '+count+' 种前区开奖结果\n模型最佳前区胜：'+pct(mw)+'（'+mw+'种）\n随机最佳前区胜：'+pct(cw)+'（'+cw+'种）\n打平：'+pct(tie)+'（'+tie+'种）\n\n模型最佳前区期望：'+(ms/count).toFixed(4)+'\n随机最佳前区期望：'+(cs/count).toFixed(4)+'\n模型−随机理论期望差：'+((ms-cs)/count).toFixed(4)+'\n\n这是公平随机开奖的结构比较，非预测结果。';}catch(err){$('baseline').textContent='计算失败：'+err.message}finally{btn.disabled=false}};
</script></body></html>
