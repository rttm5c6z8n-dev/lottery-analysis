<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4.0 模型与预测留档联动</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button,input,select{font:inherit;padding:11px;border-radius:8px}button{background:#85b4ff;color:#12233b;border:0;margin:5px}input,select{background:#142137;color:white;border:1px solid #627794;max-width:100%}label{display:block;margin:12px 0}a{color:#9bc8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v38.html">V3.8 核验</a> · <a href="./v39.html">V3.9 成绩</a><h1>V4.0 · 模型选号与预测留档联动</h1><p>直接读取V3.1已完成的全组合研究结果，选择一组号码并绑定经人工确认的目标期号，保存到V3.8本机记录。不重新计算或改动模型。</p><section><button id="load">读取V3.1已保存结果（只读）</button><p id="status" role="status">尚未读取</p><label>研究结果<select id="result"></select></label><label>组别<select id="rank"></select></label><pre id="preview"></pre></section><section><h2>绑定目标期号并留档</h2><label>官方已确认目标期号（5位）<input id="period" inputmode="numeric" placeholder="输入经官方核实的期号"></label><label><input type="checkbox" id="confirmed"> 我已独立核实目标期号，且本次保存发生在开奖前</label><button id="save">将所选组合保存到V3.8</button><p id="saved"></p><small>同一期号只能保存一组预测；如需比较多个策略，后续需升级为按“期号+策略”独立锁定。禁止用已知开奖号码补录并称为事前预测。</small></section></main><script type="module">import{chooseResult,bridgeRecord}from './v40-core.mjs';const $=id=>document.getElementById(id),KEY='lottery_v38_predictions';let results=[];function refresh(){try{const r=chooseResult(results,$('result').value,Number($('rank').value));$('preview').textContent='模型版本：'+r.version+'\n结果ID：'+r.resultId+'\n历史截止：'+r.throughPeriod+'\n生成时间：'+r.generatedAt+'\n第'+r.rank+'组：'+r.nums.slice(0,5).join(' ')+' + '+r.nums.slice(5).join(' ')+'\n注意：尚未验证预测优势。'}catch(e){$('preview').textContent=e.message}}$('load').onclick=async()=>{try{$('status').textContent='读取本机研究结果中…';const rows=await new Promise((resolve,reject)=>{const q=indexedDB.open('lottery_personal_v31',1);q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('V3.1数据库不存在'))};q.onerror=()=>reject(q.error);q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('results')){db.close();reject(Error('结果库不存在'));return}const t=db.transaction('results','readonly'),r=t.objectStore('results').getAll();r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>reject(r.error)}});results=rows.filter(x=>Array.isArray(x.picks)&&x.picks.length&&x.generatedAt).sort((a,b)=>String(b.generatedAt).localeCompare(String(a.generatedAt)));if(!results.length)throw Error('尚无已完成的V3.1选号结果');$('result').replaceChildren();for(const r of results){const o=document.createElement('option');o.value=r.id;o.textContent=r.throughPeriod+' · '+r.id;$('result').append(o)}updateRanks();$('status').textContent='读取到 '+results.length+' 份选号结果，未修改原数据'}catch(e){$('status').textContent='读取失败：'+e.message}}};function updateRanks(){const r=results.find(x=>x.id===$('result').value);$('rank').replaceChildren();for(let i=0;i<(r?.picks.length||0);i++){const o=document.createElement('option');o.value=String(i);o.textContent='第'+(i+1)+'组';$('rank').append(o)}refresh()}$('result').onchange=updateRanks;$('rank').onchange=refresh;$('save').onclick=()=>{try{if(!$('confirmed').checked)throw Error('请先独立核实目标期号和事前时间');const chosen=chooseResult(results,$('result').value,Number($('rank').value));const record=bridgeRecord({result:chosen,period:$('period').value,now:new Date().toISOString()});const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(a))throw Error('本机预测存储结构异常');if(a.some(x=>x.period===record.period))throw Error('该期号已有留档，不能覆盖');a.push(record);localStorage.setItem(KEY,JSON.stringify(a));$('saved').textContent='已保存第'+chosen.rank+'组至V3.8。可前往V3.8核验、V3.9查看成绩。'}catch(e){$('saved').textContent='保存失败：'+e.message}};</script></body></html>
