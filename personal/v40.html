<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4.0 模型与预测留档联动</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button,input,select{font:inherit;padding:11px;border-radius:8px}button{background:#85b4ff;color:#12233b;border:0;margin:5px}input,select{background:#142137;color:white;border:1px solid #627794;max-width:100%}label{display:block;margin:12px 0}a{color:#9bc8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v38.html">V3.8 核验</a> · <a href="./v39.html">V3.9 成绩</a><h1>V4.0 · 模型选号与预测留档联动</h1><p>只读筛选V3.1已完成且来源链一致的全组合存档，查看5组号码。保存时须另行核实未来目标期号与开奖计划；不会重新训练或改变原数据。</p><section><button id="load">读取V3.1已保存结果（只读）</button><p id="status" role="status">正在初始化……</p><label>研究结果<select id="result"></select></label><label>组别<select id="rank"></select></label><pre id="preview"></pre><p><small>如果读取失败，此处将显示具体错误。不要删除本机历史数据，也无需重新搜索。</small></p></section><section><h2>绑定目标期号并留档</h2><label>官方已确认目标期号（5位）<input id="period" inputmode="numeric" placeholder="输入经官方核实的期号"></label><label>官方计划开奖时间（北京时间，例 2026-11-14T20:30:00+08:00）<input id="drawAt" placeholder="YYYY-MM-DDTHH:mm:ss+08:00"></label><label>官方期号及开奖计划公告链接<input id="sourceUrl" type="url" placeholder="https://www.sport.gov.cn/..."></label><label><input type="checkbox" id="confirmed"> 我已核对官方期号、计划开奖时间及链接，确认当前尚未开奖</label><button id="save">仅保存当前选中1组</button><button id="saveFive">一次性锁定并保存全部5组</button><p id="saved"></p><small>同一期可一次性锁定同一个模型结果的5组号码；为防止开奖后增补，已有任何该期记录则禁止再次追加。旧单组记录保留不变。</small></section></main><script>
(function(){
 const status=document.getElementById('status');
 status.textContent='正在加载V4.0联动模块……';
 import('./v40-app.mjs').then(m=>m.init()).catch(e=>{
  status.textContent='模块初始化失败：'+(e&&e.message||String(e))+'。请刷新后重试；不需要清空历史数据。';
 });
})();
</script></body></html>
