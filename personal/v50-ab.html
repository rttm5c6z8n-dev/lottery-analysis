<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5.0 A/B轨候选结构分析</title><style>*{box-sizing:border-box}body{background:#101827;color:#edf3ff;font:15px/1.65 system-ui;margin:0}main{max-width:850px;margin:auto;padding:18px}section{background:#1d2b43;border:1px solid #405674;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:24px}h2{font-size:19px}button,input,select{font:inherit}button{background:#9bbdff;color:#12223e;padding:12px;border:0;border-radius:9px;font-weight:600}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a7caff}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #435671;text-align:left;font-size:13px}small{color:#c5d0e2}</style></head><body><main><a href="./v50.html">← V5.0研究方案</a><h1>V5.0 · A/B轨候选结构分析</h1><p>离线读取候选池JSON，复核前区覆盖、后区集中程度和B轨贪心选择。<strong>本页不预测未来期号，不进行正式锁定，不写入浏览器历史存档。</strong></p><section><h2>1. 导入旧模型候选池</h2><input id="file" type="file" accept=".json,application/json"><pre id="status">请选择之前导出的 v50-candidate-checkpoint-26128.json</pre></section><section><h2>2. B轨参数（仅研究）</h2><p>惩罚参数 λ：<select id="lambda"><option value="0">0（纯评分）</option><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1" selected>1.0</option><option value="2">2.0</option><option value="4">4.0</option></select></p><button id="run" disabled>计算A/B轨结构</button><pre id="summary">等待文件。</pre></section><section><h2>3. 5注对照明细</h2><div id="details"></div><button id="export" disabled>导出结构诊断JSON</button><p><small>导出仅是旧模型技术诊断，不构成下一期开奖前预注册或SHA-256锁定。旧模型历史截止26128。</small></p></section><script type="module">
import{selectCoverage}from './v50-search-core.mjs';
const $=id=>document.getElementById(id);let pool=null,report=null;
const key=p=>p.nums.join(',');
const coverage=ps=>({front:new Set(ps.flatMap(p=>p.nums.slice(0,5))).size,back:new Set(ps.flatMap(p=>p.nums.slice(5))).size,scoreSum:ps.reduce((a,p)=>a+p.score,0),frontFrequency:Object.fromEntries([...new Set(ps.flatMap(p=>p.nums.slice(0,5)))].sort((a,b)=>a-b).map(n=>[n,ps.reduce((s,p)=>s+p.nums.slice(0,5).includes(n),0)]))});
const fmt=n=>String(n).padStart(2,'0');
$('file').onchange=async e=>{pool=null;report=null;$('run').disabled=true;$('export').disabled=true;$('details').textContent='';try{const f=e.target.files?.[0];if(!f)return;const d=JSON.parse(await f.text());if(d.version!=='V5.0-candidate-pool-1'||d.throughPeriod!=='26128'||d.endFront!==324632||d.completed!==true||!Array.isArray(d.candidates)||d.candidates.length!==100||!/^[a-f0-9]{64}$/.test(d.digest)||!d.sourceResultId)throw Error('不是完整的26128旧模型Top100断点');const seen=new Set();for(const p of d.candidates){if(!Array.isArray(p.nums)||p.nums.length!==7||!Number.isFinite(p.score))throw Error('候选格式错误');const f=p.nums.slice(0,5),b=p.nums.slice(5);if(new Set(f).size!==5||new Set(b).size!==2||f.some((n,i)=>!Number.isInteger(n)||n<1||n>35||(i&&n<=f[i-1]))||b.some((n,i)=>!Number.isInteger(n)||n<1||n>12||(i&&n<=b[i-1])))throw Error('候选号码非法');if(seen.has(key(p)))throw Error('候选号码重复');seen.add(key(p))}pool=d;$('status').textContent='读取成功：100注；历史截止26128；搜索完成。\n来源ID：'+d.sourceResultId+'\n参数摘要：'+d.digest+'\n注意：本页只验证格式与内部结构，不验证评分来源SHA。';$('run').disabled=false}catch(err){$('status').textContent='无法导入：'+err.message}};
$('run').onclick=()=>{try{const lambda=Number($('lambda').value),A=pool.candidates.slice(0,5),B=selectCoverage(pool.candidates,lambda),a=coverage(A),b=coverage(B);report={type:'V5.0-AB-structure-diagnostic-only',sourceResultId:pool.sourceResultId,sourceDigest:pool.digest,throughPeriod:pool.throughPeriod,lambda,method:'greedy score minus lambda times cumulative front overlap',A:{picks:A,metrics:a},B:{picks:B,metrics:b},createdAt:new Date().toISOString(),formalLock:false};$('summary').textContent='A轨前区覆盖：'+a.front+'/35；后区覆盖：'+a.back+'/12；评分合计：'+a.scoreSum.toFixed(4)+'\nB轨前区覆盖：'+b.front+'/35；后区覆盖：'+b.back+'/12；评分合计：'+b.scoreSum.toFixed(4)+'\n覆盖变化：'+(b.front-a.front)+'个前区号码\n注意：评分是旧模型内部指标，不能解释为中奖概率。';const table=(ps)=>'<table><thead><tr><th>#</th><th>前区 + 后区</th><th>评分</th></tr></thead><tbody>'+ps.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+p.nums.slice(0,5).map(fmt).join(' ')+' + '+p.nums.slice(5).map(fmt).join(' ')+'</td><td>'+p.score.toFixed(4)+'</td></tr>').join('')+'</tbody></table>';$('details').innerHTML='<h2>A轨：原始Top5</h2>'+table(A)+'<h2>B轨：覆盖优化Top5</h2>'+table(B);$('export').disabled=false}catch(err){$('summary').textContent='计算失败：'+err.message}};
$('export').onclick=()=>{if(!report)return;const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='v50-ab-structure-diagnostic-26128.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></main></body></html>
