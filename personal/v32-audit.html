<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数理彩研 V3.2 回测审计</title><style>*{box-sizing:border-box}body{background:#101827;color:#edf3ff;font:15px -apple-system,BlinkMacSystemFont,sans-serif;margin:0}main{max-width:760px;margin:auto;padding:18px}h1{font-size:24px}h2{font-size:18px}.card{background:#1c2941;border:1px solid #3b4f6c;border-radius:15px;padding:16px;margin:14px 0}p,li{line-height:1.7;color:#c7d3e6}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{background:#142138;color:#fff;border:1px solid #667894}button{background:#3778e7;color:white;border:0;margin-top:12px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}a{color:#9fc6ff}.warn{color:#ffd48a}.ok{color:#8be4b5}small{color:#9eafc6}</style></head><body><main><h1>数理彩研 · V3.2 审计测试</h1><p><a href="./">返回V3.1</a> · 独立测试页，不修改任何历史数据</p><div class="card"><h2>导入V3.1完整追溯JSON</h2><input id="file" type="file" accept=".json,application/json"><p><small>仅在当前浏览器读取文件，不上传服务器；不修改原报告。文件很大时请耐心等待。</small></p><p id="status">尚未导入</p></div><div class="card"><h2>结构检查</h2><div id="summary">等待导入</div></div><div class="card"><h2>审计结论</h2><div id="audit"><p>历史回测结果不能直接证明未来预测能力。必须保留独立事前锁定和开奖后验证。</p></div></div><div class="card"><h2>字段与报告检查明细</h2><pre id="details">等待导入</pre><button id="download" disabled>导出审计JSON</button></div></main><script>
const $=id=>document.getElementById(id);let audit=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]));
function scan(root){const found=[],seen=new WeakSet();function visit(v,path,depth){if(!v||typeof v!=='object'||seen.has(v)||depth>12)return;seen.add(v);if(Array.isArray(v)){if(v.length&&v.some(x=>x&&typeof x==='object'&&('phase'in x||'trainThrough'in x||'cutoff'in x))){found.push({path,type:'foldRecords',count:v.length,items:v});}for(let i=0;i<Math.min(v.length,40);i++)visit(v[i],path+'['+i+']',depth+1);return;}if(('phase'in v&&'period'in v&&'trainThrough'in v))found.push({path,type:'fold',items:[v],count:1});if(('completed'in v||'cursor'in v)&&('targets'in v||'phase'in v||'weights'in v))found.push({path,type:'job',count:1,keys:Object.keys(v)});for(const [k,x] of Object.entries(v))visit(x,path+'.'+k,depth+1)}visit(root,'$',0);return found}
function analyze(obj){const found=scan(obj),groups=found.filter(x=>x.type==='foldRecords');const largest=groups.slice().sort((a,b)=>b.count-a.count)[0];const folds=largest?largest.items:found.filter(x=>x.type==='fold').map(x=>x.items[0]);const phaseCount={},duplicate=[],crossReportRepeat=[],keySet=new Set(),crossKeySet=new Map(),violations=[],unproven=[];for(const f of folds){if(!f||typeof f!=='object')continue;phaseCount[f.phase||'未标注']=(phaseCount[f.phase||'未标注']||0)+1;const reportId=f.reportId||f.validationId||f.jobId||'报告ID缺失';const key=[reportId,f.phase,f.period,f.version].join('|');if(keySet.has(key))duplicate.push(key);keySet.add(key);const crossKey=[f.phase,f.period,f.version].join('|');if(crossKeySet.has(crossKey)&&crossKeySet.get(crossKey)!==reportId)crossReportRepeat.push(crossKey);else crossKeySet.set(crossKey,reportId);if(f.trainThrough&&f.period&&Number(f.trainThrough)>=Number(f.period))violations.push('训练期号不早于目标期号：'+f.period);if(f.trainLastDate&&f.date&&f.trainLastDate>=f.date)violations.push('训练日期不早于目标日期：'+f.period);if(f.availability!=='已证实')unproven.push(f.period||'?')}return {generatedAt:new Date().toISOString(),format:'V3.2-audit-1',topLevelKeys:obj&&typeof obj==='object'?Object.keys(obj):[],detected:found.map(({path,type,count,keys})=>({path,type,count,keys})),foldCount:folds.length,phaseCount,duplicateKeyCount:duplicate.length,duplicateKeys:duplicate.slice(0,100),crossReportRepeatCount:crossReportRepeat.length,crossReportRepeatExamples:[...new Set(crossReportRepeat)].slice(0,20),temporalViolations:violations.slice(0,100),unprovenAvailabilityCount:unproven.length,limitations:['自动结构识别是初步检查，不等于完整回测复核','同一期在不同回测报告出现属于正常现象，重复键必须包含报告ID；报告ID缺失时仍需人工核对','旧数据导入时的统一可用时间不能证明历史时点可用','未独立核验官方开奖号码、模型输入、随机基准和逐期原始快照','零一等奖不能证明模型优劣；必须比较预先规定的指标与随机基准']}}
$('file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;$('status').textContent='读取并审计中…';try{const obj=JSON.parse(await file.text());audit=analyze(obj);$('summary').innerHTML='<p>识别到的逐折记录：<b>'+audit.foldCount+'</b></p><p>阶段分布：'+escapeHTML(JSON.stringify(audit.phaseCount))+'</p><p>同报告疑似重复键：'+audit.duplicateKeyCount+'；跨报告同一期重复（不视为错误）：'+audit.crossReportRepeatCount+'；训练日期/期号异常：'+audit.temporalViolations.length+'</p><p>历史可用性未证实：'+audit.unprovenAvailabilityCount+' 条</p>';$('audit').innerHTML='<p class="warn">这是结构性审计，不是预测有效性认证。</p><p>'+ (audit.foldCount?'已识别部分逐折记录，仍需独立复核历史时间证据和随机基准。':'未识别到标准逐折记录；不能据此断言报告没有记录，需核对导出格式。')+'</p><p>任何策略均不能据此宣称提高彩票中奖概率。</p>';$('details').textContent=JSON.stringify(audit,null,2);$('download').disabled=false;$('status').textContent='审计完成：'+file.name}catch(err){$('status').textContent='导入失败：'+err.message;$('download').disabled=true}});
$('download').onclick=()=>{if(!audit)return;const url=URL.createObjectURL(new Blob([JSON.stringify(audit,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='v32-audit.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
