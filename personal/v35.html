<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.5 异常号码追踪</title><style>body{margin:0;background:#101827;color:#edf3ff;font:15px/1.65 system-ui}main{max-width:880px;margin:auto;padding:20px}section{background:#1e2b43;border:1px solid #3a506d;border-radius:15px;padding:18px;margin:16px 0}button,select{font:inherit;padding:10px;border-radius:8px}button{background:#8ab6ff;color:#14223c;border:0;margin:5px}select{background:#142137;color:white}a{color:#9bc8ff}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #536582;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#c3cee0}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v34.html">V3.4</a><h1>V3.5 · 异常号码与跨年复核</h1><p>对2008、2009、2010、2012年进行描述性定位，并将早期号码偏差与后期独立时段对照。只读本机V3.1快照。</p><section><button id="load">读取本机历史</button><p id="status">等待加载</p><select id="zone"><option value="0">前区</option><option value="1">后区</option></select><button id="analyze">定位异常号码</button><div style="overflow-x:auto"><table><thead><tr><th>号码</th><th>实际</th><th>期望</th><th>偏多年份</th><th>偏少年份</th></tr></thead><tbody id="table"></tbody></table></div></section><section><h2>样本外复核（早期→后期）</h2><p>用2012年底前的数据确定高频号码，再只统计2014年以后的表现；不使用验证期挑号码。</p><button id="test">运行样本外对照</button><pre id="result"></pre><small>这里不是投注建议；历史偏差无法直接转换为下一期一等奖概率。</small></section><script type="module">import{analyze,outOfSample}from './v35-core.mjs';const $=id=>document.getElementById(id);let rows;async function read(){return new Promise((resolve,reject)=>{const q=indexedDB.open('lottery_personal_v31',1);q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('无V3.1数据库'))};q.onerror=()=>reject(q.error);q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots')){db.close();reject(Error('无快照')) ;return}const r=db.transaction('snapshots').objectStore('snapshots').getAll();r.onsuccess=()=>{const a=r.result.filter(x=>Array.isArray(x.rows)).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));db.close();resolve(a.at(-1)?.rows)};r.onerror=()=>reject(r.error)}})}$('load').onclick=async()=>{try{rows=await read();if(!rows)throw Error('未找到历史');$('status').textContent='读取成功：'+rows.length+'条；原历史未修改'}catch(e){$('status').textContent='失败：'+e.message}};$('analyze').onclick=()=>{try{if(!rows)throw Error('请先读取历史');const r=analyze(rows,{zone:Number($('zone').value)});$('table').replaceChildren();for(const n of r.numbers){const tr=document.createElement('tr');for(const x of [String(n.number).padStart(2,'0'),n.total,n.expected.toFixed(1),n.positiveYears,n.negativeYears]){const td=document.createElement('td');td.textContent=String(x);tr.append(td)}$('table').append(tr)}$('status').textContent='已定位'+r.numbers.length+'个号码；异常年份属于事后筛选'}catch(e){$('status').textContent=e.message}};$('test').onclick=()=>{try{if(!rows)throw Error('请先读取历史');const r=outOfSample(rows,{zone:Number($('zone').value)});$('result').textContent=JSON.stringify({训练期数:r.trainDraws,验证期数:r.testDraws,训练选择号码:r.selectedNumbers,验证实际命中总数:r.observed,均匀模型期望:r.expected,差值:r.difference,说明:r.warning},null,2)}catch(e){$('result').textContent=e.message}};</script></main></body></html>
