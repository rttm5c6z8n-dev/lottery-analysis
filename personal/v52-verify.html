<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5.2 预注册凭证核验</title><style>body{margin:0;background:#101827;color:#eef3ff;font:15px/1.7 system-ui}main{max-width:800px;margin:auto;padding:18px}section{background:#1e2b43;border:1px solid #405575;border-radius:14px;padding:18px;margin:15px 0}h1{font-size:26px}h2{font-size:19px}button{background:#a0c0ff;color:#102039;border:0;border-radius:9px;padding:11px;font:inherit;font-weight:600}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a7cbff}input{font:inherit;max-width:100%}small{color:#b8c9df}</style></head><body><main><a href="./v51-draft.html">← V5.1草案</a><h1>V5.2 · 预注册凭证核验</h1><p>校验V5.1三轨草案的SHA-256、A/B/C号码格式及C轨种子复现。本页只读，不修改历史档案，不声称草案已正式锁定。</p><section><h2>1. 导入草案JSON</h2><input id="file" type="file" accept=".json,application/json"><pre id="status">等待导入。</pre></section><section><h2>2. 本地独立复核</h2><button id="check" disabled>复核哈希与随机对照</button><pre id="result">尚未核验。</pre></section><section><h2>3. 事前证据说明</h2><p>本地文件与浏览器时间戳不能单独证明事前锁定。正式预注册必须在开奖前把完整凭证提交至可公开核验的GitHub提交记录，保留提交SHA与原文件，并核实官方销售截止时间。</p><p>DEMO和历史截止26128的旧模型只用于技术演示。此页不会把它们转换成正式预测，也不会向GitHub自动提交。</p><button id="export" disabled>导出核验报告JSON</button></section></main><script type="module">
const $=id=>document.getElementById(id),enc=new TextEncoder();let input=null,report=null;
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const hash=async s=>hex(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s))));
const pickValid=p=>{const n=p?.nums;if(!Array.isArray(n)||n.length!==7)return false;const a=n.slice(0,5),b=n.slice(5);return a.every((x,i)=>Number.isInteger(x)&&x>=1&&x<=35&&(!i||x>a[i-1]))&&b.every((x,i)=>Number.isInteger(x)&&x>=1&&x<=12&&(!i||x>b[i-1]))};
async function draw(seed,domain,count,max){const selected=new Set();let index=0;while(selected.size<count){if(index>10000)throw Error('随机复现超过安全次数');const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(seed+':'+domain+':'+index++)));for(let i=0;i+3<h.length&&selected.size<count;i+=4){const n=((h[i]*16777216)+(h[i+1]<<16)+(h[i+2]<<8)+h[i+3])>>>0,range=Math.floor(4294967296/max)*max;if(n<range)selected.add(n%max+1)}}return [...selected].sort((a,b)=>a-b)}
$('file').onchange=async e=>{input=null;report=null;$('check').disabled=true;$('export').disabled=true;try{const file=e.target.files?.[0];if(!file)return;if(file.size>1000000)throw Error('文件超过1MB');const j=JSON.parse(await file.text());if(!j?.payload||!/^[a-f0-9]{64}$/.test(j.sha256))throw Error('不是V5.1草案凭证');input=j;$('status').textContent='已读取：'+file.name+'。请点击独立复核。';$('check').disabled=false}catch(err){$('status').textContent='读取失败：'+err.message}};
$('check').onclick=async()=>{try{const p=input.payload;if(p.schema!=='V5.1-three-track-draft-1'||p.researchOnly!==true||p.formalLock!==false||p.throughPeriod!=='26128'||p.lambda!==1||!p.sourceResultId||!/^[a-f0-9]{64}$/.test(p.sourceDigest)||!/^[a-f0-9]{64}$/.test(p.seed)||!Array.isArray(p.A)||!Array.isArray(p.B)||!Array.isArray(p.C)||[p.A,p.B,p.C].some(a=>a.length!==5||a.some(x=>!pickValid(x))))throw Error('草案结构或号码格式不符');const calculated=await hash(JSON.stringify(p));if(calculated!==input.sha256)throw Error('SHA-256不一致：文件内容已变化');for(let i=0;i<5;i++){const a=await draw(p.seed,'front-'+i,5,35),b=await draw(p.seed,'back-'+i,2,12);if(JSON.stringify([...a,...b])!==JSON.stringify(p.C[i].nums))throw Error('C轨第'+(i+1)+'注无法由种子复现')}const unique=a=>new Set(a.map(x=>x.nums.join(','))).size===5;if(!unique(p.A)||!unique(p.B)||!unique(p.C))throw Error('某轨出现重复完整号码');report={schema:'V5.2-local-draft-verification-1',draftSha256:calculated,period:p.period,throughPeriod:p.throughPeriod,hashMatched:true,randomReproduced:true,allTracksValid:true,formalLock:false,verifiedAt:new Date().toISOString()};$('result').textContent='通过：草案SHA-256匹配。\n通过：C轨5注均可由种子独立复现。\n通过：三轨各5注格式合法且轨内无重复。\n摘要：'+calculated+'\n目标标识：'+p.period+'\n\n重要：仍是技术草案；没有完成开奖前可信时间核验或正式锁定。';$('export').disabled=false}catch(err){report=null;$('export').disabled=true;$('result').textContent='核验失败：'+err.message}};
$('export').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='v52-local-verification.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></body></html>
