<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4.1 预测记录可信度审计</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button{font:inherit;padding:11px;border-radius:8px;background:#85b4ff;color:#12233b;border:0;margin:5px}a{color:#9bc8ff}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #526581;text-align:left}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v40.html">V4.0</a> · <a href="./v39.html">V3.9</a><h1>V4.1 · 预测记录可信度审计</h1><p>对V3.8和V4.0留档做只读核查：重新计算命中数、检测重复和时间顺序异常、区分模型联动与手工预测。</p><section><button id="run">一键检查本机预测记录</button><p id="status" role="status">尚未检查</p><div id="summary"></div></section><section><h2>异常与待核问题</h2><div id="issues"></div></section><section><h2>可信度边界</h2><p>现有系统的本机留档不具有第三方防篡改时间戳；开奖号码仍为人工输入。这里的“已核验”仅指记录内部计算一致，不代表已经通过官方数据核验。</p><small>长期预测能力必须用独立、可验证的开奖前预测记录评价，不能由历史回测替代。</small></section></main><script type="module">import{auditJournal}from './v41-core.mjs';const $=id=>document.getElementById(id);$('run').onclick=()=>{try{const raw=JSON.parse(localStorage.getItem('lottery_v38_predictions')||'[]');const a=auditJournal(raw),s=a.stats;$('status').textContent='检查完成：'+s.total+'条原始记录，'+a.issues.length+'项待核问题';$('summary').replaceChildren();for(const line of ['格式有效：'+s.formatValid,'V3.1模型联动：'+s.modelLinked,'手工记录：'+s.manual,'内部核验一致：'+s.verified,'未核验：'+s.unverified,'完整5+2命中：'+s.exact,'平均前区命中：'+(s.verified?(s.frontHits/s.verified).toFixed(3):'暂无')+'（均匀基准0.714）','平均后区命中：'+(s.verified?(s.backHits/s.verified).toFixed(3):'暂无')+'（均匀基准0.333）']){const p=document.createElement('p');p.textContent=line;$('summary').append(p)}$('issues').replaceChildren();if(!a.issues.length){$('issues').textContent='未检测到内部格式或核验一致性问题；这不代表已核实官方开奖。'}else for(const issue of a.issues){const p=document.createElement('p');p.textContent='第'+(issue.index+1)+'条：'+issue.reason;$('issues').append(p)}}catch(e){$('status').textContent='检查失败：'+e.message}};</script></body></html>
