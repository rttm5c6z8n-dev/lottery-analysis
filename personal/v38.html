<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.8 开奖前预测留档</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button,input{font:inherit;padding:11px;border-radius:8px}button{background:#85b4ff;color:#12233b;border:0;margin:5px}input{background:#142137;color:white;border:1px solid #627794;width:100%;box-sizing:border-box}label{display:block;margin:10px 0}a{color:#9bc8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v37.html">V3.7</a><h1>V3.8 · 开奖前留档与开奖后核验</h1><p>建立可核对的预测记录，避免事后改号。此页面使用本机存储，不上传数据，也不提供可证实的防篡改公证。</p><section><h2>记录一期预测</h2><label>目标期号<input id="period" inputmode="numeric" placeholder="例如 26135"></label><label>前区5个号码<input id="front" placeholder="01 02 03 04 05"></label><label>后区2个号码<input id="back" placeholder="06 07"></label><label>模型或策略<input id="method" placeholder="例如 V3.1 模型A"></label><button id="save">保存预测</button><p id="status" role="status">尚未保存</p></section><section><h2>本机预测记录</h2><button id="export">导出记录JSON</button><div id="records"></div></section><section><h2>开奖后核验</h2><label>待核验期号<input id="checkPeriod" inputmode="numeric"></label><label>实际开奖号码（前5后2）<input id="draw" placeholder="01 02 03 04 05 06 07"></label><button id="check">核验并追加结果</button><p id="checkStatus"></p></section><small>必须在开奖前保存才有前瞻研究意义；本机时间和本机存储均可人为修改，不能作为第三方时间证明。历史核验仍需官方开奖来源。</small></main><script type="module">import{buildRecord,parseDraw,verifyRecord,validatePeriod}from './v38-core.mjs';const $=id=>document.getElementById(id),KEY='lottery_v38_predictions';function get(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return []}}function set(a){localStorage.setItem(KEY,JSON.stringify(a))}function show(){const div=$('records');div.replaceChildren();for(const r of get()){const p=document.createElement('p');const t=r.ticket;p.textContent=r.period+' · '+r.method+' · '+t.front.join(' ')+' + '+t.back.join(' ')+' · '+r.createdAt+(r.verification?' · 核验 '+r.verification.result.frontHits+'+'+r.verification.result.backHits:' · 未核验');div.append(p)}}$('save').onclick=()=>{try{const a=get(),period=validatePeriod($('period').value);if(a.some(x=>x.period===period))throw Error('该期号已存在；为防覆盖，不能重复保存');const r=buildRecord({period,front:$('front').value,back:$('back').value,method:$('method').value,createdAt:new Date().toISOString()});a.push(r);set(a);$('status').textContent='本机已保存；不是第三方防篡改时间戳';show()}catch(e){$('status').textContent=e.message}};$('check').onclick=()=>{try{const period=validatePeriod($('checkPeriod').value),draw=parseDraw($('draw').value),a=get(),i=a.findIndex(x=>x.period===period);if(i<0)throw Error('找不到该期预测');a[i]=verifyRecord(a[i],draw,new Date().toISOString());set(a);$('checkStatus').textContent='核验完成：前区 '+a[i].verification.result.frontHits+' 个，后区 '+a[i].verification.result.backHits+' 个。请独立核实官方开奖数据。';show()}catch(e){$('checkStatus').textContent=e.message}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records:get()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='v38-predictions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};show();</script></body></html>
