<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数理彩研 · 浏览器实际运行自测</title><style>body{margin:0;background:#101827;color:#edf3ff;font:15px/1.65 system-ui}main{max-width:760px;margin:auto;padding:18px}section{background:#1e2b43;border:1px solid #3a506d;border-radius:16px;padding:18px;margin:16px 0}button{background:#3978e7;color:white;border:0;border-radius:9px;padding:12px;font:inherit;width:100%}a{color:#9ccaff}.pass{color:#91e6aa}.fail{color:#ffb8b8}li{margin:10px 0}small{color:#c6d1e0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><a href="./">← 返回数理彩研首页</a><h1>浏览器运行自测</h1><p>直接加载当前线上部署的研究模块，执行8组模拟数据测试。不会创建、修改或删除你的历史数据库和预测记录。</p><section><button id="run">开始只读模拟自测</button><p id="status" role="status">尚未运行</p><ol id="results"></ol><small id="notice">此工具验证前端模块运行及内部逻辑，不等于Cloudflare部署全站正常，也不检验真实开奖号码来源。</small></section></main><script type="module">const $=id=>document.getElementById(id),button=$('run'),status=$('status'),list=$('results');async function run(){button.disabled=true;status.textContent='正在加载线上模块并运行模拟测试…';list.replaceChildren();try{const mod=await import('./browser-self-test.mjs');const r=mod.runSelfTests();status.textContent='通过 '+r.passed+'/'+r.total+' 项；测试时间 '+r.ranAt;status.className=r.passed===r.total?'pass':'fail';for(const c of r.cases){const li=document.createElement('li');li.className=c.ok?'pass':'fail';li.textContent=(c.ok?'通过：':'失败：')+c.name+(c.detail?' — '+c.detail:'');list.append(li)}$('notice').textContent=r.notice+' 页面有加载或脚本报错时，自测将显示失败。'}catch(e){status.textContent='无法完成自测：'+(e?.message||String(e))+'。可能是模块文件未部署、浏览器阻止或实际代码错误。';status.className='fail'}finally{button.disabled=false}}button.onclick=run;</script></body></html>
