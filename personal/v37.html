<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.7 设备证据与分界检验</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button,input,select{font:inherit;padding:11px;border-radius:8px}button{background:#85b4ff;color:#12233b;border:0;margin:5px}input,select{background:#142137;color:white;border:1px solid #627794}a{color:#9bc8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v36.html">V3.6</a><h1>V3.7 · 设备证据时间轴与分界检验</h1><p>先核实设备更换证据，再对有明确依据的日期进行检验。当前没有核实的2019年启用日，不自动将任意日期当作换机日。</p><section><h2>设备证据时间轴</h2><div id="evidence"></div></section><section><h2>历史号码分界检验</h2><p>输入有依据的分界日期。支持探索性日期，但结果必须标明非确认性研究。</p><label>分界日期 <input id="date" type="date"></label><label>区域 <select id="zone"><option value="0">前区</option><option value="1">后区</option></select></label><button id="run">读取本机历史并检验</button><p id="status" role="status">等待检验</p><pre id="result"></pre><small>整期置换检验保留同一期号码间的依赖关系；不使用开奖后的数据预测此前的开奖。此分析不能证明机器可预测。</small></section></main><script type="module">import{EVIDENCE,compareAtDate}from './v37-core.mjs';const $=id=>document.getElementById(id);for(const e of EVIDENCE){const p=document.createElement('p'),a=document.createElement('a');a.href=e.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=e.title;p.append(document.createTextNode(e.date+' · '+e.type+' · '),a,document.createTextNode(' — '+e.note));$('evidence').append(p)}function read(){return new Promise((resolve,reject)=>{const q=indexedDB.open('lottery_personal_v31',1);q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('V3.1数据库不存在'))};q.onerror=()=>reject(q.error);q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots')){db.close();reject(Error('无快照'));return}const r=db.transaction('snapshots','readonly').objectStore('snapshots').getAll();r.onsuccess=()=>{const s=r.result.filter(x=>Array.isArray(x.rows)).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))).at(-1);db.close();resolve(s?.rows)};r.onerror=()=>reject(r.error)}})}$('run').onclick=async()=>{try{if(!$('date').value)throw Error('请先输入有依据的分界日期');$('status').textContent='读取历史中…';const rows=await read();if(!rows)throw Error('本机没有历史快照');$('status').textContent='正在进行1000次置换模拟…';await new Promise(r=>setTimeout(r,40));const a=compareAtDate(rows,$('date').value,{zone:Number($('zone').value)});$('result').textContent=JSON.stringify({分界日期:a.cutoff,区域:a.zone,前期数:a.before,后期数:a.after,置换P值:a.pValue,模拟次数:a.iterations,检验方法:a.method,解释:a.warning},null,2);$('status').textContent='计算完成；分界日期尚未获得设备启用证据确认'}catch(e){$('status').textContent='无法计算：'+e.message}};</script></body></html>
