<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4.2 官方开奖证据辅助核验</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button,input{font:inherit;padding:11px;border-radius:8px}button{background:#85b4ff;color:#12233b;border:0;margin:5px}input{width:100%;box-sizing:border-box;background:#142137;color:white;border:1px solid #627794}label{display:block;margin:12px 0}a{color:#9bc8ff}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v40.html">V4.0</a> · <a href="./v41.html">V4.1</a><h1>V4.2 · 官方开奖证据辅助核验</h1><p>输入官方开奖公告的期号、7个号码和来源链接，系统自动匹配已保存的预测并计算命中数。当前未接入可信自动抓取服务，故不冒充“自动官方核实”。</p><section><h2>录入官方开奖证据</h2><label>期号<input id="period" inputmode="numeric" placeholder="例如 26135"></label><label>开奖号码（前区5个 + 后区2个）<input id="numbers" placeholder="01 02 03 04 05 06 07"></label><label>官方公告HTTPS链接<input id="url" type="url" placeholder="https://..."></label><label>公告标题<input id="title" placeholder="官方开奖公告标题"></label><label><input id="agree" type="checkbox"> 我已打开公告，确认期号和7个号码与原文一致</label><button id="verify">匹配预测并追加核验</button><p id="status" role="status">等待核验</p></section><section><h2>核验记录状态</h2><button id="audit">检查已有核验记录冲突</button><div id="details"></div><p><small>仅检查域名和填写格式，不会自动打开或验证公告正文；保存时间为本机时间。任何已核验记录都不会被覆盖。</small></p></section></main><script type="module">import{prepareEvidence,applyEvidence,findConflicts}from './v42-core.mjs';const $=id=>document.getElementById(id),KEY='lottery_v38_predictions';const read=()=>{const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(a))throw Error('本机预测数据格式异常');return a};$('verify').onclick=()=>{try{if(!$('agree').checked)throw Error('请先核对官方公告并勾选确认');const evidence=prepareEvidence({period:$('period').value,numbers:$('numbers').value,url:$('url').value,title:$('title').value,observedAt:new Date().toISOString()});const a=read(),out=applyEvidence(a,evidence);if(findConflicts(out.records).length)throw Error('发现同一期号码冲突，已停止保存');localStorage.setItem(KEY,JSON.stringify(out.records));$('status').textContent='已为 '+out.matched+' 条预测追加核验；官方来源仍为人工摘录，未自动验证网页。'}catch(e){$('status').textContent='未保存：'+e.message}};$('audit').onclick=()=>{try{const a=read(),conflicts=findConflicts(a);$('details').textContent='预测记录 '+a.length+' 条；号码冲突期号：'+(conflicts.join('、')||'未发现')+'。此结果不等于官方核验完成。'}catch(e){$('details').textContent=e.message}};</script></body></html>
