<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.3 年度分段研究</title><style>body{background:#101827;color:#edf3ff;font:15px/1.65 system-ui;margin:0}main{max-width:900px;margin:auto;padding:20px}section{background:#1e2b43;border:1px solid #3a506d;border-radius:15px;padding:18px;margin:16px 0}button,input,select{font:inherit;padding:11px;border-radius:8px}button{background:#80afff;color:#11213a;border:0;margin:6px}input,select{background:#142137;color:white;border:1px solid #6b809e;max-width:100%}a{color:#9bc8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #50627d;text-align:left}small{color:#bac9de}</style></head><body><main><a href="./">← 返回V3.1</a> · <a href="./v32-machine.html">V3.2</a><h1>V3.3 · 年度分段与数据完整性研究</h1><p>只读本机V3.1快照，按开奖日期分组。设备更换时间未核实前不做因果归因。</p><section><button id="load">读取本机历史（只读）</button><p id="status">等待读取</p></section><section><h2>年度前后区频率检验</h2><select id="zone"><option value="0">前区</option><option value="1">后区</option></select><button id="run">按年份计算</button><div id="summary"></div><div style="overflow-x:auto"><table><thead><tr><th>年份</th><th>期数</th><th>首末期号</th><th>卡方</th><th>模拟P值</th></tr></thead><tbody id="years"></tbody></table></div><small>每年2000次模拟。逐年查看多个P值需要多重检验修正，不能只挑异常年份。</small></section><section><h2>自定义分界日期</h2><p>仅在取得官方设备启用日期后，才能把分界日期解释为设备变更。</p><input id="cutoff" type="date" value="2019-07-01"><button id="compare">计算两侧分布差异</button><pre id="comparison"></pre></section><script type="module">import{segments,comparePeriods,auditPeriods}from './v33-core.mjs';const $=id=>document.getElementById(id);let rows;async function snapshot(){return new Promise((resolve,reject)=>{const q=indexedDB.open('lottery_personal_v31',1);q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('未找到V3.1库'))};q.onerror=()=>reject(q.error);q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots')){db.close();reject(Error('没有快照'));return}const tx=db.transaction('snapshots'),r=tx.objectStore('snapshots').getAll();r.onsuccess=()=>{const a=r.result.filter(x=>Array.isArray(x.rows)).sort((x,y)=>String(x.createdAt).localeCompare(String(y.createdAt)));db.close();resolve(a.at(-1)?.rows)};r.onerror=()=>reject(r.error)}})}$('load').onclick=async()=>{try{rows=await snapshot();if(!rows)throw Error('无历史快照');const a=auditPeriods(rows);$('status').textContent='已读取 '+a.valid+'/'+a.total+' 条，结构异常 '+a.issues.length+' 条；涵盖 '+a.years.length+' 个自然年。未核实缺期。'}catch(e){$('status').textContent='读取失败：'+e.message}};$('run').onclick=()=>{try{if(!rows)throw Error('请先读取历史');$('status').textContent='正在计算…';setTimeout(()=>{try{const a=segments(rows,{zone:Number($('zone').value)});$('years').replaceChildren();for(const y of a.years){const tr=document.createElement('tr');for(const v of [y.year,y.count,y.first+'–'+y.last,y.test?y.test.statistic.toFixed(2):'样本不足',y.test?y.test.pValue.toFixed(4):'—']){const td=document.createElement('td');td.textContent=String(v);tr.append(td)}$('years').append(tr)}$('summary').textContent='完成 '+a.years.length+' 个年份；仅为探索性统计。';$('status').textContent='计算完成'}catch(e){$('status').textContent=e.message}},30)}catch(e){$('status').textContent=e.message}};$('compare').onclick=()=>{try{if(!rows)throw Error('请先读取历史');const a=comparePeriods(rows,$('cutoff').value,{zone:Number($('zone').value)});$('comparison').textContent=JSON.stringify({分界:a.cutoff,区域:a.zone,分界前期数:a.before,分界后期数:a.after,分布差异统计量:a.statistic,说明:a.warning},null,2)}catch(e){$('comparison').textContent=e.message}};</script></main></body></html>
