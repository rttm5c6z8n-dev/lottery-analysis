<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.2 摇奖机制研究</title><style>body{margin:0;background:#0d1424;color:#e6ecfa;font:15px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:820px;margin:auto;padding:22px 16px 60px}h1{font-size:25px}h2{font-size:19px}section{background:#1b2942;border:1px solid #344967;border-radius:16px;padding:20px;margin:15px 0}a{color:#9bc8ff}small,.muted{color:#b7c6dd}button,textarea{font:inherit;border-radius:9px;padding:10px}button{background:#7fb1ff;border:0;color:#0b1c36;font-weight:700;cursor:pointer}textarea{box-sizing:border-box;width:100%;min-height:110px;background:#111d32;color:#fff;border:1px solid #506383}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><p><a href="/personal/">← 返回 V3.1 研究库</a></p><h1>V3.2 · 摇奖机制与统计研究</h1><p class="muted">独立研究模块，不修改V3.1历史记录。研究物理机制、厂家资料与可检验的统计偏差，不宣称能够预测一等奖。</p><section><h2>设备与厂家证据库</h2><div id="evidence"></div></section><section><h2>待检验研究假设</h2><div id="hypotheses"></div></section><section><h2>号码频率检验（本机运行）</h2><p>粘贴JSON数组，每期包含 nums 数组，前5位为前区、后2位为后区；至少30期。不会上传服务器。</p><textarea id="rows" placeholder='[{"nums":[1,2,3,4,5,6,7]}, ...]'></textarea><p><button id="front">检验前区</button> <button id="back">检验后区</button></p><pre id="result" aria-live="polite">等待数据。</pre><small>蒙特卡洛检验仅判断频率与均匀抽样模型的差异。历史异常不等于未来可预测。</small></section></main><script type="module">import{EVIDENCE,HYPOTHESES,frequencyTest}from './v32-machine.mjs';const $=id=>document.getElementById(id);for(const e of EVIDENCE){const p=document.createElement('p'),a=document.createElement('a');a.href=e.url;a.textContent=e.title;a.target='_blank';a.rel='noopener noreferrer';p.append(a,document.createTextNode(' · '+e.kind+' · '+e.certainty+' — '+e.claim));$('evidence').append(p)}for(const h of HYPOTHESES){const p=document.createElement('p');p.textContent=h.id+' '+h.title+'：'+h.method+'。所需数据：'+h.requires;$('hypotheses').append(p)}function run(z){try{const data=JSON.parse($('rows').value),out=frequencyTest(data,z);$('result').textContent=JSON.stringify({区域:out.zone,期数:out.draws,期望次数:out.expected,卡方统计量:out.statistic,模拟P值:out.pValue,各号码次数:out.counts,说明:out.warning},null,2)}catch(e){$('result').textContent='数据检查失败：'+e.message}}$('front').onclick=()=>run(0);$('back').onclick=()=>run(1);</script></body></html>
