<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.2 摇奖机制研究</title><style>body{margin:0;background:#0d1424;color:#e6ecfa;font:15px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:820px;margin:auto;padding:22px 16px 60px}h1{font-size:25px}h2{font-size:19px}section{background:#1b2942;border:1px solid #344967;border-radius:16px;padding:20px;margin:15px 0}a{color:#9bc8ff}small,.muted{color:#b7c6dd}button,textarea{font:inherit;border-radius:9px;padding:10px}button{background:#7fb1ff;border:0;color:#0b1c36;font-weight:700;cursor:pointer}textarea{box-sizing:border-box;width:100%;min-height:110px;background:#111d32;color:#fff;border:1px solid #506383}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><p><a href="/personal/">← 返回 V3.1 研究库</a></p><h1>V3.2 · 摇奖机制与统计研究</h1><p class="muted">独立研究模块，不修改V3.1历史记录。研究物理机制、厂家资料与可检验的统计偏差，不宣称能够预测一等奖。</p><section><h2>设备与厂家证据库</h2><div id="evidence"></div></section><section><h2>待检验研究假设</h2><div id="hypotheses"></div></section><section><h2>号码频率检验（本机运行）</h2><p>优先读取本机V3.1已保存的历史快照，也可读取原历史缓存；不会上传服务器或修改原数据。手动JSON仍作为备用入口。</p><button id="loadHistory">读取本机历史（只读）</button><p id="loadStatus" role="status">尚未读取本机历史。</p><textarea id="rows" placeholder='[{"nums":[1,2,3,4,5,6,7]}, ...]'></textarea><p><button id="front">检验前区</button> <button id="back">检验后区</button></p><pre id="result" aria-live="polite">等待数据。</pre><small>蒙特卡洛检验仅判断频率与均匀抽样模型的差异。历史异常不等于未来可预测。</small></section></main><script type="module">import{EVIDENCE,HYPOTHESES,frequencyTest,checkDraw}from './v32-machine.mjs';const $=id=>document.getElementById(id);for(const e of EVIDENCE){const p=document.createElement('p'),a=document.createElement('a');a.href=e.url;a.textContent=e.title;a.target='_blank';a.rel='noopener noreferrer';p.append(a,document.createTextNode(' · '+e.kind+' · '+e.certainty+' — '+e.claim));$('evidence').append(p)}for(const h of HYPOTHESES){const p=document.createElement('p');p.textContent=h.id+' '+h.title+'：'+h.method+'。所需数据：'+h.requires;$('hypotheses').append(p)}let loaded=null;function openSnapshots(){return new Promise((resolve,reject)=>{const q=indexedDB.open('lottery_personal_v31',1);q.onerror=()=>reject(q.error||Error('数据库打开失败'));q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('本机尚未创建V3.1研究库'))};q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots')){db.close();reject(Error('找不到历史快照'));return}const tx=db.transaction('snapshots','readonly'),r=tx.objectStore('snapshots').getAll();r.onsuccess=()=>{const arr=r.result.filter(x=>Array.isArray(x.rows)&&x.rows.length);db.close();resolve(arr.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))).at(-1))};r.onerror=()=>{db.close();reject(r.error)}}})}async function loadHistory(){const status=$('loadStatus');status.textContent='正在只读加载…';try{let source,rows;try{const snapshot=await openSnapshots();if(!snapshot)throw Error('无有效快照');rows=snapshot.rows;source='V3.1快照 '+snapshot.id}catch(e){const raw=localStorage.getItem('lottery_v2_dlt');if(!raw)throw Error('没有可用的V3.1快照或原历史缓存：'+e.message);rows=JSON.parse(raw);source='原历史缓存 lottery_v2_dlt'}if(!Array.isArray(rows))throw Error('历史格式不是数组');const valid=rows.filter(checkDraw);if(valid.length<30)throw Error('有效记录不足30条：'+valid.length);loaded=valid;status.textContent='读取成功：'+source+'，合法 '+valid.length+' 条；排除 '+(rows.length-valid.length)+' 条。仅用于探索性统计，未验证历史发布时间。';$('result').textContent='数据已加载，可点击前区或后区检验。'}catch(e){loaded=null;status.textContent='读取失败：'+e.message}}$('loadHistory').onclick=loadHistory;function run(z){try{const data=$('rows').value.trim()?JSON.parse($('rows').value):loaded;if(!data)throw Error('请先点击读取本机历史，或粘贴JSON');const out=frequencyTest(data,z);$('result').textContent=JSON.stringify({区域:out.zone,期数:out.draws,期望次数:out.expected,卡方统计量:out.statistic,模拟P值:out.pValue,各号码次数:out.counts,说明:out.warning},null,2)}catch(e){$('result').textContent='数据检查失败：'+e.message}}$('front').onclick=()=>run(0);$('back').onclick=()=>run(1);</script></body></html>
