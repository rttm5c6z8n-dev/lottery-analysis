<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.4 数据完整性与异常复核</title><style>body{margin:0;background:#101827;color:#eaf0ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1e2b43;border:1px solid #3a506d;border-radius:16px;padding:20px;margin:15px 0}button,select{font:inherit;padding:11px;border-radius:8px}button{background:#83b1ff;color:#13243c;border:0;margin:5px}select{background:#142137;color:#fff}a{color:#9bc8ff}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #526581;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bac9de}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v33.html">V3.3</a><h1>V3.4 · 数据完整性与异常复核</h1><p>先排查期号跳跃，再进行按年多重检验修正。只读本机V3.1快照，不改写历史数据。</p><section><button id="load">读取并审计本机快照</button><p id="status">尚未读取</p><div id="audit"></div></section><section><h2>年度统计的多重比较修正</h2><select id="zone"><option value="0">前区</option><option value="1">后区</option></select><button id="run">计算年度Holm修正</button><div style="overflow-x:auto"><table><thead><tr><th>年份</th><th>期数</th><th>原始P值</th><th>修正P值</th></tr></thead><tbody id="years"></tbody></table></div><small>每年2000次模拟；模拟P值的分辨率有限。显著差异不等于能预测下一期。</small></section><script type="module">import{inspectHistory,yearlyReview}from './v34-core.mjs';const $=id=>document.getElementById(id);let rows;async function read(){return new Promise((resolve,reject)=>{const q=indexedDB.open('lottery_personal_v31',1);q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('V3.1数据库不存在'))};q.onerror=()=>reject(q.error);q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots')){db.close();reject(Error('快照库不存在'));return}const r=db.transaction('snapshots','readonly').objectStore('snapshots').getAll();r.onsuccess=()=>{const s=r.result.filter(x=>Array.isArray(x.rows)).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))).at(-1);db.close();resolve(s?.rows)};r.onerror=()=>reject(r.error)}})}$('load').onclick=async()=>{try{rows=await read();if(!rows)throw Error('无快照');const a=inspectHistory(rows);$('status').textContent='读取 '+a.total+' 条；格式有效 '+a.valid+' 条；待核问题 '+a.problems.length+' 项';$('audit').replaceChildren();const p=document.createElement('p');p.textContent=a.disclaimer;$('audit').append(p);for(const y of a.byYear){const d=document.createElement('p');d.textContent=y.year+'：'+y.count+'期；疑似期号跳跃 '+y.missingCandidateCount+' 个（'+y.gaps.length+' 段）';$('audit').append(d)}}catch(e){$('status').textContent='失败：'+e.message}};$('run').onclick=()=>{if(!rows){$('status').textContent='请先读取';return}$('status').textContent='正在计算…';setTimeout(()=>{try{const a=yearlyReview(rows,Number($('zone').value));$('years').replaceChildren();for(const y of a.years){const tr=document.createElement('tr');for(const x of [y.year,y.count,y.pValue===null?'样本不足':y.pValue.toFixed(5),y.holmAdjustedP===null?'—':y.holmAdjustedP.toFixed(5)]){const td=document.createElement('td');td.textContent=String(x);tr.append(td)}$('years').append(tr)}$('status').textContent='年度检验与修正完成'}catch(e){$('status').textContent='失败：'+e.message}},20)};</script></main></body></html>
