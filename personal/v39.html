<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.9 预测成绩看板</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button{font:inherit;padding:11px;border-radius:8px;background:#85b4ff;color:#12233b;border:0;margin:5px}a{color:#9bc8ff}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #526581;text-align:left}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v38.html">V3.8 预测留档</a><h1>V3.9 · 预测成绩与随机基准</h1><p>自动汇总V3.8本机记录，显示真实核验次数、完整5+2命中及部分命中情况，不将回测成绩冒充事前预测。</p><section><button id="refresh">读取本机预测记录并统计</button><p id="status" role="status">尚未读取</p><div id="summary"></div></section><section><h2>命中分布</h2><div style="overflow-x:auto"><table><thead><tr><th>前区命中</th><th>后区0</th><th>后区1</th><th>后区2</th></tr></thead><tbody id="hist"></tbody></table></div><small>理论一等奖概率每注1/21,425,712。数学期望不是保证中奖次数。</small></section><section><h2>数据可信度</h2><p>本页面仅统计V3.8本机留档，尚未自动连接V3.1模型结果。实际开奖号仍由用户手工输入，必须对照官方公告；本机保存时间不是独立公证。</p><p>后续需要统一模型输出接口、冻结策略版本、自动抓取可验证的官方开奖结果，并严格记录事前发布时间。</p></section></main><script type="module">import{summarize,validateImportedRecord}from './v39-core.mjs';const $=id=>document.getElementById(id);$('refresh').onclick=()=>{try{const raw=JSON.parse(localStorage.getItem('lottery_v38_predictions')||'[]');if(!Array.isArray(raw))throw Error('存储结构异常');const rows=raw.filter(validateImportedRecord);const s=summarize(rows);$('status').textContent='读取 '+rows.length+' 条有效格式记录；已核验 '+s.verified+' 条';$('summary').replaceChildren();for(const line of ['预测总数：'+s.total,'未核验：'+s.pending,'一等奖5+2：'+s.exact,'前区平均命中：'+(s.meanFront===null?'暂无':s.meanFront.toFixed(3))+'（均匀抽样基准0.714）','后区平均命中：'+(s.meanBack===null?'暂无':s.meanBack.toFixed(3))+'（均匀抽样基准0.333）']){const p=document.createElement('p');p.textContent=line;$('summary').append(p)}$('hist').replaceChildren();for(let f=0;f<=5;f++){const tr=document.createElement('tr');for(const v of [f,...s.hist[f]]){const td=document.createElement('td');td.textContent=String(v);tr.append(td)}$('hist').append(tr)}}catch(e){$('status').textContent='统计失败：'+e.message}};</script></body></html>
