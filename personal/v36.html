<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3.6 自动研究报告</title><style>body{margin:0;background:#101827;color:#eaf1ff;font:15px/1.65 system-ui}main{max-width:850px;margin:auto;padding:20px}section{background:#1d2b43;border:1px solid #40516e;border-radius:16px;padding:20px;margin:15px 0}button,select{font:inherit;padding:11px;border-radius:8px}button{background:#85b4ff;color:#12233b;border:0;margin:5px}select{background:#142137;color:white}a{color:#9bc8ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:65vh;overflow:auto}small{color:#b8c8dc}</style></head><body><main><a href="./">← V3.1</a> · <a href="./v35.html">V3.5</a><h1>V3.6 · 一键研究报告</h1><p>一键读取本机历史，生成数据审计、年度修正、异常号码、样本外对照和设备证据时间轴。报告可复制，不上传服务器。</p><section><select id="zone"><option value="0">前区</option><option value="1">后区</option></select><button id="generate">读取历史并生成报告</button><button id="copy" disabled>复制报告</button><p id="status" role="status">尚未生成</p><pre id="report"></pre></section><small>研究结果不代表下一期预测能力。首次生成可能需要数秒，原数据库保持只读。</small></main><script type="module">import{createReport,formatReport}from './v36-core.mjs';const $=id=>document.getElementById(id);let report='';async function read(){return new Promise((resolve,reject)=>{const q=indexedDB.open('lottery_personal_v31',1);q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('V3.1数据库不存在'))};q.onerror=()=>reject(q.error);q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('snapshots')){db.close();reject(Error('无历史快照'));return}const r=db.transaction('snapshots','readonly').objectStore('snapshots').getAll();r.onsuccess=()=>{const s=r.result.filter(x=>Array.isArray(x.rows)).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))).at(-1);db.close();resolve(s?.rows)};r.onerror=()=>reject(r.error)}})}$('generate').onclick=async()=>{try{$('status').textContent='读取本机快照中…';const rows=await read();if(!rows)throw Error('无有效历史快照');$('status').textContent='正在计算年度统计，请稍候…';await new Promise(resolve=>setTimeout(resolve,40));const r=createReport(rows,{zone:Number($('zone').value)});report=formatReport(r);$('report').textContent=report;$('copy').disabled=false;$('status').textContent='完成：'+r.audit.valid+'条格式有效记录，'+r.yearly.length+'个年度。注意：未完成逐期官方核验。'}catch(e){$('status').textContent='生成失败：'+e.message}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);$('status').textContent='报告已复制'}catch(e){$('status').textContent='复制失败，请长按报告文字复制'}};</script></body></html>
