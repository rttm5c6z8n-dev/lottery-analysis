<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数理彩研 V6.2 数据恢复</title><style>body{background:#101827;color:#edf3ff;font:16px/1.6 system-ui;margin:0}main{max-width:720px;margin:auto;padding:20px}.card{background:#202d45;border:1px solid #455a78;border-radius:16px;padding:18px;margin:16px 0}button,input,textarea{font:inherit;padding:12px;border-radius:9px;max-width:100%;box-sizing:border-box}button{background:#3978e7;color:white;border:0;margin:6px}input,textarea{width:100%;background:#111e32;color:white;border:1px solid #7185a1}a{color:#9bc8ff}small,p{color:#bdcbe0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.warn{color:#ffd18a}</style><main><h1>数理彩研 · V6.2</h1><p>数据恢复与备份工具（不覆盖V6.0原始记录）</p><p><a href="./">返回V6.0</a> · <a href="./audit.html">V6.1开奖核验</a></p><div class="card"><h2>1. 查看本机原始记录</h2><button id="load">读取V6.0记录</button><p id="status">尚未读取。</p><div id="view"></div><button id="backup">导出本机原始记录JSON</button></div><div class="card"><h2>2. 从备份恢复（只读预览）</h2><input id="file" type="file" accept=".json,application/json"><p id="fileStatus">选择以前导出的V6.0 JSON，先预览，不会自动写入。</p><div id="preview"></div><button id="merge" disabled>确认合并到本机（保留原记录）</button></div><div class="card"><h2>3. 截图号码补录</h2><p class="warn">截图补录只能标记为“事后恢复”，不能证明开奖前保存或参与事前回测。</p><label>期号</label><input id="issue" maxlength="5" placeholder="例如26131"><label>五组号码，每行：前区5个 + 后区2个</label><textarea id="rows" rows="7" placeholder="05 14 16 23 29 + 10 11"></textarea><button id="manual">保存为截图恢复记录</button><p id="manualStatus"></p></div></main><script>
const key='lottery-v6-research-records',extra='lottery-v62-recovery-records',el=id=>document.getElementById(id);let incoming=[];
const read=k=>{try{let v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch{return []}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const valid=r=>r&&/^\d{5}$/.test(String(r.issue))&&Array.isArray(r.rows)&&r.rows.length===5&&r.rows.every(x=>Array.isArray(x.front)&&Array.isArray(x.back)&&x.front.length===5&&x.back.length===2&&x.front.every(n=>Number.isInteger(n)&&n>=1&&n<=35)&&x.back.every(n=>Number.isInteger(n)&&n>=1&&n<=12)&&new Set(x.front).size===5&&new Set(x.back).size===2);
const fingerprint=r=>JSON.stringify([r.issue,r.created||'',r.rows]);
function show(){let a=read(key),b=read(extra);el('status').textContent='V6.0原始记录 '+a.length+' 条；V6.2恢复记录 '+b.length+' 条。';el('view').innerHTML=[...a.map(x=>({...x,tag:'V6.0原始'})),...b.map(x=>({...x,tag:'V6.2恢复'}))].map(r=>'<p>'+esc(r.tag)+' · '+esc(r.issue)+' · '+esc(r.created||'时间未知')+' · '+r.rows.map(x=>x.front.join(' ')+' + '+x.back.join(' ')).join(' / ')+'</p>').join('')||'<p>暂无记录。请检查是否使用原来的浏览器和网站域名。</p>'}
function download(obj,name){let u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
el('load').onclick=show;el('backup').onclick=()=>download({version:'6.2-backup',exportedAt:new Date().toISOString(),original:read(key),recovered:read(extra)},'lottery-v62-backup.json');
el('file').onchange=async e=>{incoming=[];el('merge').disabled=true;try{let f=e.target.files[0];if(!f)return;if(f.size>10000000)throw Error('文件超过10MB');let j=JSON.parse(await f.text());let rows=Array.isArray(j)?j:Array.isArray(j.records)?j.records:Array.isArray(j.original)?[...j.original,...(j.recovered||[])]:[];if(!rows.length)throw Error('没有可识别的记录');incoming=rows.filter(valid);if(!incoming.length)throw Error('未找到格式正确的5组记录');el('fileStatus').textContent='识别 '+incoming.length+' 条有效记录。确认合并前请核对。';el('preview').textContent=incoming.map(r=>r.issue+' · '+(r.created||'无保存时间')).join('；');el('merge').disabled=false}catch(err){el('fileStatus').textContent='读取失败：'+err.message}};
el('merge').onclick=()=>{let old=read(key),recovered=read(extra),seen=new Set([...old,...recovered].map(fingerprint)),added=0;for(let r of incoming){let f=fingerprint(r);if(!seen.has(f)){recovered.push({...r,recovery:{type:'imported-backup',importedAt:new Date().toISOString(),originalTimestampUnverified:true}});seen.add(f);added++}}try{localStorage.setItem(extra,JSON.stringify(recovered));el('fileStatus').textContent='合并完成，新增 '+added+' 条；原V6.0记录未修改。';show()}catch(err){el('fileStatus').textContent='保存失败：'+err.message}};
el('manual').onclick=()=>{let issue=el('issue').value.trim(),lines=el('rows').value.trim().split(/\n+/);let rows=lines.map(line=>{let m=line.trim().match(/^(.*?)\s*\+\s*(.*?)$/);if(!m)return null;let parse=s=>s.trim().split(/[\s,，、]+/).map(Number);return {front:parse(m[1]),back:parse(m[2])}});let record={issue,rows,created:null,method:'screenshot-manual-recovery',recovery:{type:'manual-screenshot',enteredAt:new Date().toISOString(),originalTimestampUnverified:true}};if(!valid(record)){el('manualStatus').textContent='请填写5位期号和5行有效号码（前区1-35不重复，后区1-12不重复）。';return}try{let a=read(extra);if(a.some(r=>r.issue===issue&&JSON.stringify(r.rows)===JSON.stringify(rows))){el('manualStatus').textContent='相同号码已经补录，未重复保存。';return}a.push(record);localStorage.setItem(extra,JSON.stringify(a));el('manualStatus').textContent='已标记为事后恢复并保存。请点击导出备份。';show()}catch(err){el('manualStatus').textContent='保存失败：'+err.message}};show();
</script></html>
