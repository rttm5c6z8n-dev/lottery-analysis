<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数理彩研 V6.1 开奖核验</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3ff;font:16px/1.6 system-ui}main{max-width:760px;margin:auto;padding:18px}.card{background:#202d45;border:1px solid #455a78;border-radius:15px;padding:18px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:9px;max-width:100%}input{background:#101d31;color:white;border:1px solid #7185a1;width:100%;margin:6px 0 12px}button{background:#3978e7;color:white;border:0}a{color:#9bc8ff}.warn{color:#ffd18a}.ok{color:#9fe4b1}table{width:100%;border-collapse:collapse}td,th{padding:9px 3px;border-bottom:1px solid #52617a;text-align:left;font-size:14px}</style><main><h1>数理彩研 · V6.1</h1><p>开奖核验与长期效果评估（只读优先）</p><p><a href="./">返回 V6.0 选号工作台</a></p><section class="card"><h2>1. 读取已保存记录</h2><button id="load">读取本机 V6.0 记录</button><p id="status">尚未读取。也可从备份文件导入，不会覆盖本机记录。</p><label>从 V6.0 / V6.2 JSON 备份读取</label><input type="file" id="file" accept=".json,application/json"></section><section class="card"><h2>已读取号码</h2><div id="recordView"></div></section><section class="card"><h2>2. 核验开奖号码</h2><p class="warn">请根据官方开奖结果人工核对期号和号码。仅用于研究对照，不自动确认官方来源。</p><label>期号</label><input id="issue" inputmode="numeric" maxlength="5" placeholder="例如 26131"><label>前区5个号码</label><input id="front" placeholder="01 02 03 04 05"><label>后区2个号码</label><input id="back" placeholder="01 02"><button id="check">核验本期已保存的5组</button><div id="output"></div></section><section class="card"><h2>3. 研究说明</h2><p>本工具按单注前后区命中数对照，不自动认定奖级或奖金。没有开奖前保存的记录，不允许事后补充并冒充事前预测。多期统计需要独立的开奖证据和足够样本。</p><p>任何5组覆盖分散策略都不能据此宣称一等奖概率提高。</p></section></main><script>
const $=id=>document.getElementById(id),key='lottery-v6-research-records';let records=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function validRow(r){return r&&Array.isArray(r.front)&&r.front.length===5&&new Set(r.front).size===5&&r.front.every(n=>Number.isInteger(n)&&n>=1&&n<=35)&&Array.isArray(r.back)&&r.back.length===2&&new Set(r.back).size===2&&r.back.every(n=>Number.isInteger(n)&&n>=1&&n<=12)}

function normalize(d){
let original=Array.isArray(d)?d:Array.isArray(d?.records)?d.records:Array.isArray(d?.original)?d.original:[];
let recovered=Array.isArray(d?.recovered)?d.recovered:[];
const valid=r=>r&&/^\d{5}$/.test(String(r.issue))&&Array.isArray(r.rows)&&r.rows.length===5&&r.rows.every(validRow);
return [...original.filter(valid).map(r=>({...r,_type:'原始登记'})),...recovered.filter(valid).map(r=>({...r,_type:'事后恢复'}))];
}
function load(d){
records=normalize(d);
$('status').textContent='已读取 '+records.length+' 条有效记录；原始数据未修改。';
$('recordView').innerHTML=records.map(r=>'<h3>'+esc(r.issue)+' · '+esc(r._type)+'</h3><p class="warn">'+(r._type==='事后恢复'?'原始预测时间未验证，不计入事前预测成绩':'登记时间仍需独立核实')+'</p>'+r.rows.map((p,i)=>'<p>第'+(i+1)+'组：'+p.front.map(n=>String(n).padStart(2,'0')).join(' ')+' + '+p.back.map(n=>String(n).padStart(2,'0')).join(' ')+'</p>').join('')).join('')||'暂无有效记录';
}
$('load').onclick=()=>{try{load({original:JSON.parse(localStorage.getItem(key)||'[]'),recovered:JSON.parse(localStorage.getItem('lottery-v62-recovery-records')||'[]')})}catch(e){$('status').textContent='读取失败：'+e.message}};
$('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>1e7)throw Error('文件超过10MB');load(JSON.parse(await f.text()))}catch(e){$('status').textContent='备份读取失败：'+e.message}};
function parse(s,k,max){let a=s.trim().split(/[\s,，、]+/).map(Number);return a.length===k&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=max)&&new Set(a).size===k?a:null}
$('check').onclick=()=>{let issue=$('issue').value.trim(),f=parse($('front').value,5,35),b=parse($('back').value,2,12),out=$('output');if(!/^\d{5}$/.test(issue)||!f||!b){out.textContent='请核对期号和开奖号码格式。';return}let found=records.filter(r=>r.issue===issue);if(!found.length){out.textContent='未找到该期已保存的5组记录。请先读取本机记录或备份。';return}out.innerHTML=found.map(r=>{let date=r.created&&!Number.isNaN(Date.parse(r.created))?new Date(r.created).toLocaleString('zh-CN'):'原始时间未知';let rows=r.rows.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+p.front.filter(n=>f.includes(n)).length+'+ '+p.back.filter(n=>b.includes(n)).length+'</td></tr>').join('');return '<h3>登记时间：'+esc(date)+'</h3><p>策略：'+esc(r.method||'未注明')+'</p><table><tr><th>组别</th><th>前区命中 + 后区命中</th></tr>'+rows+'</table>'}).join('')+'<p class="warn">核对结果仅显示命中数量；官方开奖数据须另行核实。此页面不会改写保存记录。</p>'};
</script></html>
