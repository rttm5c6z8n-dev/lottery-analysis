<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数理彩研 V7.0</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3ff;font:16px/1.6 system-ui}main{max-width:760px;margin:auto;padding:18px}h1{font-size:29px}h2{font-size:21px}.card{background:#202d45;border:1px solid #465a79;border-radius:16px;padding:18px;margin:16px 0}button,input{font:inherit;padding:12px;border-radius:10px;max-width:100%}button{border:0;background:#3978e7;color:white;margin:6px 4px 6px 0}input{background:#101d31;color:white;border:1px solid #7185a1;width:100%;margin:6px 0 12px}p,small{color:#bfccdf}.warn{color:#ffd18a}.ok{color:#9fe4b1}.nums{font-size:18px;font-weight:700;letter-spacing:.5px}a{color:#9bc8ff}hr{border:0;border-top:1px solid #445572;margin:14px 0}label{display:block}</style></head><body><main><h1>数理彩研 · V7.1</h1><p>统一手机工作台 · 自动保存 · 同期锁定 · 开奖核验 · 统计</p><p class="warn">研究用途。随机生成的每注一等奖概率相同；本机时间仅作辅助记录，不构成可信的开奖前时间证明；恢复记录不作为已验证的事前预测。</p><section class="card"><h2>1. 恢复历史记录</h2><button id="read">一键读取本机V6记录</button><label>或选择 V6.0 / V6.2 JSON 备份<input id="import" type="file" accept=".json,application/json"></label><p id="importStatus"></p><button id="export">导出V7全部备份JSON</button></section><section class="card"><h2>2. 一键选号并自动保存</h2><label>目标期号（5位，按官方公告确认）<input id="issue" inputmode="numeric" maxlength="5" placeholder="例如26133"></label><button id="generate">生成5组并立即保存</button><p id="genStatus"></p><div id="picks"></div></section><section class="card"><h2>3. 开奖核验</h2><p>开奖号码需人工核对官方公告；核验只统计命中数，不自动判断奖金。</p><label>开奖期号<input id="drawIssue" inputmode="numeric" maxlength="5"></label><label>前区5个号码<input id="front" placeholder="01 02 03 04 05"></label><label>后区2个号码<input id="back" placeholder="01 02"></label><button id="verify">核验并保存结果</button><p id="verifyStatus" role="status" aria-live="polite" style="font-weight:700;min-height:2em"></p></section><section class="card"><h2>4. 记录与长期评估</h2><div id="stats"></div><div id="history"></div><p class="warn">100/300期指标仅在存在对应期数的事前记录和真实开奖时计算；不把单期或事后恢复记录冒充回测。</p></section><p><a href="../v6/">旧V6工作台</a> · <a href="../v6/recovery.html">V6.2恢复工具</a></p></main><script>
const $=id=>document.getElementById(id),KEY='lottery-v7-records';const readKey=k=>{try{let a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}};let records=readKey(KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]));
const fmt=a=>a.map(x=>String(x).padStart(2,'0')).join(' ');
const validRow=x=>x&&Array.isArray(x.front)&&Array.isArray(x.back)&&x.front.length===5&&x.back.length===2&&new Set(x.front).size===5&&new Set(x.back).size===2&&x.front.every(n=>Number.isInteger(n)&&n>=1&&n<=35)&&x.back.every(n=>Number.isInteger(n)&&n>=1&&n<=12);
const valid=r=>r&&/^\d{5}$/.test(String(r.issue))&&Array.isArray(r.rows)&&r.rows.length===5&&r.rows.every(validRow);
const id=r=>JSON.stringify([r.issue,r.rows]);const save=()=>{localStorage.setItem(KEY,JSON.stringify(records));render()};
function merge(items,recovered){let seen=new Set(records.map(id)),n=0;for(const r of items){if(!valid(r)||seen.has(id(r)))continue;records.push({...r,provenance:recovered?'imported-unverified':r.provenance||'local',verified:null});seen.add(id(r));n++}save();return n}
function unpack(d){if(Array.isArray(d))return d;if(Array.isArray(d?.records))return d.records;return [...(Array.isArray(d?.original)?d.original:[]),...(Array.isArray(d?.recovered)?d.recovered:[])]}
function parse(s,n,max){let a=s.trim().split(/[\s,，、]+/).map(Number);return a.length===n&&a.every(x=>Number.isInteger(x)&&x>=1&&x<=max)&&new Set(a).size===n?a:null}
function sample(n,k){let a=Array.from({length:n},(_,i)=>i+1);for(let i=0;i<k;i++){let u=new Uint32Array(1);crypto.getRandomValues(u);let j=i+(u[0]%(n-i));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k).sort((a,b)=>a-b)}
function render(){let ordered=records.slice().reverse(),verified=records.filter(r=>r.verified),local=records.filter(r=>r.provenance==='local-v7'&&r.verified&&r.created&&r.verified.at&&Date.parse(r.created)<Date.parse(r.verified.at));let periods=new Set(local.map(r=>r.issue));let count=periods.size;$('stats').textContent='已保存 '+records.length+' 条；已核验 '+verified.length+' 条；有本机选号时间且已核验的不同期号 '+count+' 期（本机时间未独立认证）。100期统计：'+(count>=100?'样本期数达到门槛，仍须检查来源和时间':'尚缺 '+(100-count)+' 期')+'；300期统计：'+(count>=300?'样本期数达到门槛，仍须检查来源和时间':'尚缺 '+(300-count)+' 期')+'。';$('history').innerHTML=ordered.map(r=>'<hr><b>'+esc(r.issue)+'</b> · '+esc(r.provenance||'旧版')+' · '+(r.verified?'已核验':'待核验')+'<div>'+r.rows.map((x,i)=>'<div>第'+(i+1)+'组：'+fmt(x.front)+' + '+fmt(x.back)+'</div>').join('')+'</div>'+(r.created?'<small>本机生成时间：'+esc(r.created)+'</small>':'<small>无可用本机生成时间</small>')+(r.verified?'<small> 命中：'+r.verified.hits.map(x=>x[0]+'+'+x[1]).join(' / ')+'</small>':'')).join('')||'<p>暂无记录</p>'}

$('read').onclick=()=>{let old=readKey('lottery-v6-research-records'),rec=readKey('lottery-v62-recovery-records');let n=merge([...old,...rec],true);$('importStatus').textContent='本机V6发现 '+(old.length+rec.length)+' 条，新增 '+n+' 条；不会修改旧数据。'};
$('import').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>10000000)throw Error('文件大于10MB');let d=JSON.parse(await f.text()),a=unpack(d),n=merge(a,true);$('importStatus').textContent='备份识别 '+a.length+' 条，新增 '+n+' 条；原始时间未经核实。'}catch(err){$('importStatus').textContent='导入失败：'+err.message}};
$('generate').onclick=()=>{let issue=$('issue').value.trim();if(!/^\\d{5}$/.test(issue)){$('genStatus').textContent='请先输入5位目标期号';return}let previous=records.filter(r=>r.issue===issue);if(previous.length){$('genStatus').textContent='该期已有 '+previous.length+' 份记录，已锁定，不再重新生成。请在下方历史记录查看，避免重复选号。';$('genStatus').style.color='#ffd18a';return}let fp=sample(35,35),bp=sample(12,12),rows=Array.from({length:5},(_,i)=>({front:fp.slice(i*5,i*5+5).sort((a,b)=>a-b),back:bp.slice(i*2,i*2+2).sort((a,b)=>a-b)}));let r={issue,rows,created:new Date().toISOString(),method:'uniform-coverage-v7.1',provenance:'local-v7',verified:null};try{records.push(r);save();$('genStatus').style.color='#9fe4b1';$('genStatus').textContent='5组已锁定并保存到本机。记录时间 '+r.created+'（设备时间，非独立认证）；请立即导出备份。';$('picks').innerHTML=rows.map((x,i)=>'<p class="nums">第'+(i+1)+'组：'+fmt(x.front)+' + '+fmt(x.back)+'</p>').join('')}catch(err){records.pop();$('genStatus').textContent='保存失败：'+err.message}};

$('verify').onclick=()=>{let issue=$('drawIssue').value.trim(),f=parse($('front').value,5,35),b=parse($('back').value,2,12);if(!/^\d{5}$/.test(issue)||!f||!b){let missing=[];if(!/^\d{5}$/.test(issue))missing.push('5位开奖期号');if(!f)missing.push('前区5个不同的1—35号码');if(!b)missing.push('后区2个不同的1—12号码');$('verifyStatus').textContent='尚未核验：请实际输入'+missing.join('、')+'。灰色示例不是已填写内容。';$('verifyStatus').style.color='#ffd18a';$('verifyStatus').scrollIntoView({block:'center',behavior:'smooth'});return}let a=records.filter(r=>r.issue===issue);if(!a.length){$('verifyStatus').textContent='未找到'+issue+'期的已保存记录，请先检查期号。';$('verifyStatus').style.color='#ffd18a';$('verifyStatus').scrollIntoView({block:'center',behavior:'smooth'});return}if(a.some(r=>r.verified&&(JSON.stringify(r.verified.front)!==JSON.stringify(f)||JSON.stringify(r.verified.back)!==JSON.stringify(b)))){$('verifyStatus').textContent='该期已有不同的核验号码，已停止覆盖。请先人工核实官方公告。';$('verifyStatus').style.color='#ffd18a';return}for(let r of a){r.verified={at:new Date().toISOString(),front:f,back:b,hits:r.rows.map(x=>[x.front.filter(n=>f.includes(n)).length,x.back.filter(n=>b.includes(n)).length])}}try{save();$('verifyStatus').textContent='核验成功，已保存 '+a.length+' 条记录。请自行确认官方开奖来源。';$('verifyStatus').style.color='#9fe4b1';$('verifyStatus').scrollIntoView({block:'center',behavior:'smooth'})}catch(err){$('verifyStatus').textContent='保存失败：'+err.message}};
$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({version:'7.1',exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='lottery-v7-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};render();</script></body></html>
