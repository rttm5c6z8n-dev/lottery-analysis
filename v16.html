<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16 · 体彩官方数据核验</title><style>body{margin:0;background:#101827;color:#eef3ff;font:16px/1.7 system-ui;padding:18px}main{max-width:720px;margin:auto}.card{background:#1d2b43;border:1px solid #39506d;border-radius:18px;padding:20px;margin:16px 0}button{background:#3978e7;border:0;border-radius:9px;color:white;padding:13px 18px;font-weight:700;font-size:16px;width:100%;margin:8px 0}input{width:100%;box-sizing:border-box;background:#2a405e;color:white;padding:12px;border:1px solid #617594;border-radius:8px}small,p{color:#bcc9de}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #455a75;padding:8px;text-align:left;word-break:break-all}a{color:#91c7ff}</style><main><h1>V16 · 体彩官方数据交叉核验</h1><p>官方接口试连接｜逐期比对｜只标记实际核验的记录。不修改原始历史数据。</p><div class="card"><h2>1. 本机历史数据</h2><p id="local">检查中…</p><p>与原统计首页共用浏览器缓存。</p></div><div class="card"><h2>2. 体彩官方接口试连接</h2><p>数据源：中国体育彩票公开开奖查询接口。是否允许浏览器跨域访问，需要实际测试；连接失败不代表数据错误。</p><label>查询页码</label><input id="page" type="number" min="1" value="1"><button id="run">尝试读取官方最近30期并比对</button><p id="status">尚未连接。此页面不会把第三方数据当作官方已核验。</p><p><a href="https://www.sporttery.cn/digitallottery/index.html" target="_blank" rel="noopener">查看中国体育彩票官方页面</a></p></div><div class="card"><h2>3. 核验结果</h2><p id="summary">等待官方接口响应。</p><div style="overflow-x:auto"><table><thead><tr><th>期号</th><th>本地</th><th>官方接口</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div></div><p>注意：单次核验仅覆盖本次成功读取的期数，不代表2945期全量核验。核验不是预测，不提高彩票中奖概率。</p><a href="./index.html">返回统计首页</a></main><script>
const $=id=>document.getElementById(id);let local=[];try{local=JSON.parse(localStorage.getItem('lottery_v2_dlt')||'[]');if(!Array.isArray(local))local=[]}catch(e){}$('local').textContent=local.length?'已读取本机大乐透历史记录 '+local.length+' 期':'未发现本机历史缓存，请先打开统计首页加载数据';
function norm(s){return String(s||'').replace(/[^0-9]/g,'')}function parseDraw(x){let period=String(x.lotteryDrawNum||x.lottery_draw_num||x.issue||'').trim(),date=String(x.lotteryDrawTime||x.lottery_draw_time||x.date||'').slice(0,10),raw=x.lotteryDrawResult||x.lottery_draw_result||'';let nums=Array.isArray(raw)?raw.map(Number):String(raw).match(/\d{1,2}/g)?.map(Number)||[];return {period,date,nums}}function fmt(r){return r?r.nums.map(n=>String(n).padStart(2,'0')).join(' '):'无'}$('run').onclick=async()=>{let b=$('run');b.disabled=true;$('status').textContent='正在请求中国体育彩票接口…';$('rows').innerHTML='';try{let page=Math.max(1,Math.floor(Number($('page').value)||1));let u='https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageSize=30&isVerify=1&pageNo='+page;let response=await fetch(u,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('HTTP '+response.status);let json=await response.json();let list=json?.value?.list;if(!Array.isArray(list))throw Error('返回格式不符合预期');let official=list.map(parseDraw).filter(r=>/^\d{5}$/.test(r.period)&&r.nums.length===7);if(!official.length)throw Error('没有解析到有效开奖期数');let map=new Map(local.map(r=>[String(r.period),r]));let match=0,diff=0,missing=0;for(let r of official){let old=map.get(r.period),same=old&&old.date===r.date&&old.nums.join(',')===r.nums.join(',');let state=!old?'本地缺失':same?'一致':'不一致';if(!old)missing++;else if(same)match++;else diff++;let tr=document.createElement('tr');for(let v of [r.period,fmt(old),fmt(r),state]){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr)}$('summary').textContent='本次官方接口返回 '+official.length+' 期；一致 '+match+'；不一致 '+diff+'；本地缺失 '+missing+'。其余历史记录未核验。';$('status').textContent='本次接口请求成功。请注意官方网页公告仍是最终核对依据。'}catch(e){$('status').textContent='接口读取失败：'+e.message+'。可能是跨域限制、访问策略或接口变更。未执行任何核验，也没有修改本机数据。';$('summary').textContent='本次无有效核验结果。'}finally{b.disabled=false}};
</script></html>
